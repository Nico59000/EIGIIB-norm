name: E16-A3 retention windows, bounded preservation, readback and restore verification

on:
  pull_request:
    paths:
      - 'extensions/E16-A3-*'
      - 'tools/eigiib_retention_readback_restore_check.py'
      - 'tools/eigiib_historical_e16_a2_replay.py'
      - 'schemas/eigiib-e16-a3-*'
      - 'conformance/retention-readback-restore.json'
      - 'conformance/e16-a3-*'
      - 'conformance/E16-A3-*'
      - 'tests/test_eigiib_retention_readback_restore.py'
      - 'tests/fixtures/e16-a3/**'
      - 'docs/E16-A3-*'
      - '.github/workflows/e16-a3-retention-readback-restore.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retention-readback-restore:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Historical E16-A2 replay
        shell: bash
        run: python tools/eigiib_historical_e16_a2_replay.py . --json > historical-e16-a2-report.json
      - name: E16-A3 unit tests
        run: python -m unittest -v tests/test_eigiib_retention_readback_restore.py
      - name: Retention, readback and restore report
        shell: bash
        run: |
          python tools/eigiib_retention_readback_restore_check.py . \
            --history-report historical-e16-a2-report.json \
            --json > actual-e16-a3-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          actual = json.loads(Path('actual-e16-a3-report.json').read_text(encoding='utf-8'))
          expected = json.loads(Path('tests/fixtures/e16-a3/expected-report.json').read_text(encoding='utf-8'))
          if actual != expected:
              raise SystemExit('E16-A3 report mismatch')
          PY
      - name: Parse authorities
        run: |
          python -c "import json,pathlib; [json.loads(pathlib.Path(p).read_text(encoding='utf-8')) for p in ['conformance/retention-readback-restore.json','conformance/e16-a3-authority-manifest.json','conformance/e16-a3-adoption-transition.json','conformance/e16-a3-authority-freeze.json','schemas/eigiib-e16-a3-retention-readback-restore.schema.json','schemas/eigiib-e16-a3-authority-manifest.schema.json','schemas/eigiib-e16-a3-adoption-transition.schema.json','schemas/eigiib-e16-a3-authority-freeze.schema.json','conformance/extension-graph.json']]"
      - name: Extension graph
        shell: bash
        run: python tools/eigiib_extension_graph_check.py . --json
      - name: Exact E16-A2 ancestry
        shell: bash
        run: git merge-base --is-ancestor 1bd5929a5a4415df8758b220765925ac80a797bc HEAD
