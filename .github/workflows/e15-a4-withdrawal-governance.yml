name: E15-A4 historical authority replay

on:
  pull_request:
    paths:
      - 'extensions/E15-A5-*'
      - 'tools/eigiib_e15_*.py'
      - 'tools/eigiib_historical_e15_a4_replay.py'
      - 'schemas/eigiib-e15-a5-*'
      - 'conformance/e15-a5-*'
      - 'conformance/e15-final-closure.json'
      - 'tests/test_eigiib_e15_*.py'
      - 'tests/fixtures/e15-a5/**'
      - 'docs/E15-A5-*'
      - 'docs/E15-FINAL-CLOSURE-REPORT.md'
      - 'EIGIIB.toml'
      - '.github/workflows/e15-a4-withdrawal-governance.yml'
      - '.github/workflows/e15-a5-final-closure.yml'
      - '.github/workflows/eigiib.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-e15-a4:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Exact E15-A4 historical replay
        shell: bash
        run: |
          python tools/eigiib_historical_e15_a4_replay.py . --json > historical-e15-a4-report.json
          python -c "import json,pathlib; r=json.loads(pathlib.Path('historical-e15-a4-report.json').read_text()); assert r['overall_result']=='conformant'; assert r['e15_a4_result']=='conformant'; assert r['e15_a4_tests_result']=='conformant'"
      - name: Exact E15-A4 ancestry
        shell: bash
        run: git merge-base --is-ancestor fce0ba52930e32069b54ab8f5634501a130222a7 HEAD
