name: E16-A1 bounded CI fix publisher

on:
  push:
    branches:
      - agent/e16-a1-historical-authority-continuity-preservation-intent-custodian-replica-binding
    paths:
      - '.e16a1-fix/**'
      - '.github/workflows/e16-a1-ci-fix-publisher.yml'
  pull_request:
    branches:
      - agent/m0-a7-e16-entry-normalization-e15-authority-continuity
    paths:
      - '.e16a1-fix/**'
      - '.github/workflows/e16-a1-ci-fix-publisher.yml'

permissions:
  contents: write

concurrency:
  group: e16-a1-ci-fix-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/e16-a1-historical-authority-continuity-preservation-intent-custodian-replica-binding
          fetch-depth: 0
      - name: Materialize exact CI corrections
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, shutil, tarfile
          from pathlib import Path

          root = Path('.')
          payload_dir = root / '.e16a1-fix'
          parts = sorted(payload_dir.glob('payload.b64.*'))
          if not parts:
              raise SystemExit('CI fix payload is missing')
          encoded = ''.join(path.read_text(encoding='ascii') for path in parts)
          archive_bytes = base64.b64decode(encoded, validate=True)
          if len(archive_bytes) != 5607:
              raise SystemExit(f'unexpected archive size: {len(archive_bytes)}')
          if hashlib.sha256(archive_bytes).hexdigest() != 'a144c34cf27eab82bf0b50ac63abf726e4149399069a4c94286e33bfcc1c49d0':
              raise SystemExit('CI fix archive digest mismatch')

          archive = payload_dir / 'fix.tar.gz'
          archive.write_bytes(archive_bytes)
          unpacked = payload_dir / 'unpacked'
          unpacked.mkdir()
          with tarfile.open(archive, 'r:gz') as tf:
              names = sorted(member.name for member in tf.getmembers() if member.isfile())
              expected_names = [
                  '.github/workflows/e15-a5-final-closure.yml',
                  'tools/eigiib_extension_graph_check.py',
              ]
              if names != expected_names:
                  raise SystemExit(f'unexpected archive manifest: {names}')
              tf.extractall(unpacked, filter='data')

          expected = {
              '.github/workflows/e15-a5-final-closure.yml': (4248, '660d200feced091ffd54f90601bdc45a82bb8ddf12667257100485b49394edc0'),
              'tools/eigiib_extension_graph_check.py': (17528, 'b61d72074141664605c6b0562c4c92e9788f95868a50fd310a9e34f4396daa59'),
          }
          for rel, (size, digest) in expected.items():
              source = unpacked / rel
              data = source.read_bytes()
              if len(data) != size or hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit(f'file identity mismatch: {rel}')
              target = root / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)

          freeze_path = root / 'conformance/e16-a1-authority-freeze.json'
          freeze = json.loads(freeze_path.read_text(encoding='utf-8'))
          matches = [entry for entry in freeze['authorities'] if entry.get('path') == 'tools/eigiib_extension_graph_check.py']
          if len(matches) != 1:
              raise SystemExit('extension graph checker freeze entry is not unique')
          matches[0]['bytes'] = 17528
          matches[0]['sha256'] = 'b61d72074141664605c6b0562c4c92e9788f95868a50fd310a9e34f4396daa59'
          freeze_path.write_text(json.dumps(freeze, indent=2, ensure_ascii=False) + '\n', encoding='utf-8', newline='\n')
          PY
      - name: Validate corrected surface
        shell: bash
        run: |
          python -m py_compile tools/eigiib_extension_graph_check.py
          python - <<'PY'
          import importlib.util, sys
          from pathlib import Path, PureWindowsPath
          spec = importlib.util.spec_from_file_location('graphcheck', Path('tools/eigiib_extension_graph_check.py'))
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          checker = module.Checker(Path('.'), PureWindowsPath('conformance/extension-graph.json'))
          if checker.manifest_ref() != 'conformance/extension-graph.json':
              raise SystemExit('Windows manifest reference is not canonical POSIX')
          PY
          python tools/eigiib_extension_graph_check.py . --json > corrected-graph-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('corrected-graph-report.json').read_text(encoding='utf-8'))
          if report.get('structural_result') != 'conformant':
              raise SystemExit(f'corrected extension graph is non-conformant: {report.get("findings")}')
          PY
          python -m unittest -v tests/test_eigiib_preservation_intent.py
          python -m json.tool conformance/e16-a1-authority-freeze.json >/dev/null
      - name: Commit clean correction
        shell: bash
        run: |
          git rm -r .e16a1-fix
          git rm .github/workflows/e16-a1-ci-fix-publisher.yml
          git add \
            .github/workflows/e15-a5-final-closure.yml \
            conformance/e16-a1-authority-freeze.json \
            tools/eigiib_extension_graph_check.py
          git config user.name 'EIGIIB bounded publisher'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'E16-A1: fix descendant CI portability'
          git push origin HEAD:agent/e16-a1-historical-authority-continuity-preservation-intent-custodian-replica-binding
