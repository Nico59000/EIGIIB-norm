name: E14-A5-F1 canonical path and authority rebinding

on:
  pull_request:
    paths:
      - '.github/workflows/e14-a5-f1-canonicalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  canonicalize:
    if: github.head_ref == 'agent/e14-a5-f1-portable-authority-rebind-workflow-neutral-publication'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply bounded F1 correction
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json

          root = Path('.')

          def replace_idempotent(path, old, new):
              text = path.read_text(encoding='utf-8')
              if old in text:
                  text = text.replace(old, new)
                  path.write_text(text, encoding='utf-8', newline='\n')
              elif new not in text:
                  raise SystemExit(f'expected pattern missing in {path}: {old!r}')

          a2 = root / 'tools/eigiib_disclosure_authorization_check.py'
          replace_idempotent(a2, 'loc=str(self.upstream_path)', 'loc=self.upstream_path.as_posix()')
          replace_idempotent(a2, 'reg.get("upstream_registry")!=str(self.upstream_path)', 'reg.get("upstream_registry")!=self.upstream_path.as_posix()')
          replace_idempotent(a2, 'str(self.registry_path))', 'self.registry_path.as_posix())')

          a3 = root / 'tools/eigiib_correlation_control_check.py'
          replace_idempotent(a3, 'p=str(self.projection_registry_path)', 'p=self.projection_registry_path.as_posix()')
          replace_idempotent(a3, 'p=str(self.authorization_registry_path)', 'p=self.authorization_registry_path.as_posix()')
          replace_idempotent(a3, 'str(self.projection_registry_path)', 'self.projection_registry_path.as_posix()')
          replace_idempotent(a3, 'str(self.authorization_registry_path)', 'self.authorization_registry_path.as_posix()')
          replace_idempotent(a3, 'str(self.registry_path)', 'self.registry_path.as_posix()')

          a5 = root / 'tools/eigiib_e14_release_check.py'
          for name in ['a1_path', 'a2_path', 'a3_path', 'a4_path', 'registry_path', 'freeze_path']:
              replace_idempotent(a5, f'str(self.{name})', f'self.{name}.as_posix()')

          contract = root / 'extensions/E14-A5-F1-PORTABLE-AUTHORITY-REBIND-WORKFLOW-NEUTRAL-PUBLICATION.md'
          replace_idempotent(
              contract,
              '- compares generated JSON reports as decoded objects across platforms;\n',
              '- compares generated JSON reports as decoded objects across platforms;\n- canonicalizes repository-relative authority and upstream-registry paths to POSIX form before comparison;\n',
          )

          review = root / 'conformance/E14-A5-F1-MANUAL-REVIEW.md'
          replace_idempotent(
              review,
              '- the corrected A4 checker bytes are refrozen exactly;\n',
              '- the corrected A4 checker bytes are refrozen exactly;\n- repository-relative authority paths compare in canonical POSIX form on every supported platform;\n',
          )

          freeze_path = root / 'conformance/e14-a5-authority-freeze.json'
          freeze = json.loads(freeze_path.read_text(encoding='utf-8'))
          indexed = {entry['path']: entry for entry in freeze['authorities']}
          indexed['.github/workflows/e14-a4-disclosure-revocation.yml'].update(
              bytes=1703,
              sha256='e2a0b4d9ca60257ae305c382ec19689fa9d1e72e3ffbd43e15122ccd86a95de3',
          )
          indexed['schemas/eigiib-e14-a3-correlation-control.schema.json'].update(
              bytes=6104,
              sha256='48b349d9951122b66f7903d1465a2b97c5d1dcbe652534f9cd987ece5d20fb8f',
          )
          for rel in [
              '.github/workflows/e14-a5-final-closure.yml',
              'tools/eigiib_disclosure_authorization_check.py',
              'tools/eigiib_correlation_control_check.py',
              'tools/eigiib_e14_release_check.py',
              'extensions/E14-A5-F1-PORTABLE-AUTHORITY-REBIND-WORKFLOW-NEUTRAL-PUBLICATION.md',
              'conformance/E14-A5-F1-MANUAL-REVIEW.md',
          ]:
              data = (root / rel).read_bytes()
              indexed[rel]['bytes'] = len(data)
              indexed[rel]['sha256'] = sha256(data).hexdigest()
          freeze_path.write_text(json.dumps(freeze, indent=2) + '\n', encoding='utf-8', newline='\n')
          PY
      - name: Validate bounded correction
        shell: bash
        run: |
          python -m py_compile tools/eigiib_disclosure_authorization_check.py tools/eigiib_correlation_control_check.py tools/eigiib_e14_release_check.py
          python -m unittest tests.test_eigiib_confidential_evidence tests.test_eigiib_disclosure_authorization tests.test_eigiib_correlation_control tests.test_eigiib_disclosure_revocation tests.test_eigiib_e14_release tests.test_eigiib_e14_release_matrix -v
          python tools/eigiib_e14_release_check.py . --json > actual-release.json
          python - <<'PY'
          import json
          from pathlib import Path
          actual = json.loads(Path('actual-release.json').read_text(encoding='utf-8'))
          expected = json.loads(Path('tests/fixtures/e14-a5/expected-release-report.json').read_text(encoding='utf-8'))
          if actual != expected:
              raise SystemExit('E14-A5 release report mismatch after bounded correction')
          PY
      - name: Publish bounded non-workflow correction
        shell: bash
        run: |
          git config user.name 'eigiib-closure-bot'
          git config user.email 'eigiib-closure-bot@users.noreply.github.com'
          git add \
            tools/eigiib_disclosure_authorization_check.py \
            tools/eigiib_correlation_control_check.py \
            tools/eigiib_e14_release_check.py \
            extensions/E14-A5-F1-PORTABLE-AUTHORITY-REBIND-WORKFLOW-NEUTRAL-PUBLICATION.md \
            conformance/E14-A5-F1-MANUAL-REVIEW.md \
            conformance/e14-a5-authority-freeze.json
          git diff --cached --quiet && exit 0
          git commit -m 'E14-A5-F1: canonicalize authority paths and refreeze published bytes'
          git push origin HEAD:"${{ github.head_ref }}"
