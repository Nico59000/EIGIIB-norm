name: E14-A4 revocation freshness and anti-rollback replay

on:
  pull_request:
    paths:
      - 'extensions/E14-A4-*'
      - 'tools/eigiib_disclosure_revocation_check.py'
      - 'schemas/eigiib-e14-a4-*'
      - 'conformance/disclosure-revocation.json'
      - 'tests/test_eigiib_disclosure_revocation.py'
      - 'tests/fixtures/e14-a4/**'
      - 'EIGIIB.toml'
      - '.github/workflows/e14-a4-disclosure-revocation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disclosure-revocation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Historical E14-A4 replay
        shell: bash
        run: |
          python tools/eigiib_historical_e14_replay.py . --output-dir .e14-history --json > e14-history.json
          python -c "import json,pathlib; r=json.loads(pathlib.Path('e14-history.json').read_text()); assert r['component_results']['e14-a4']=='conformant'"
      - name: Exact E14 source ancestry
        run: git merge-base --is-ancestor 472e14fbb3d92205eabf10438e90295e19125ea4 HEAD
