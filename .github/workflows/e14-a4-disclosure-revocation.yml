name: E14-A4 revocation freshness and anti-rollback replay

on:
  pull_request:
    paths:
      - 'extensions/E14-A4-*'
      - 'tools/eigiib_disclosure_revocation_check.py'
      - 'schemas/eigiib-e14-a4-*'
      - 'conformance/disclosure-revocation.json'
      - 'tests/test_eigiib_disclosure_revocation.py'
      - 'tests/fixtures/e14-a4/**'
      - 'EIGIIB.toml'
      - '.github/workflows/e14-a4-disclosure-revocation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disclosure-revocation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Unit tests
        run: python -m unittest tests.test_eigiib_disclosure_revocation -v
      - name: Structural report
        shell: bash
        run: |
          python tools/eigiib_disclosure_revocation_check.py . --json > actual.json
          python - <<'PY'
          import json
          from pathlib import Path
          actual=json.loads(Path('actual.json').read_text(encoding='utf-8'))
          expected=json.loads(Path('tests/fixtures/e14-a4/expected-report.json').read_text(encoding='utf-8'))
          if actual != expected: raise SystemExit('E14-A4 report mismatch')
          PY
      - name: Parse authorities
        run: python -c "import json,tomllib,pathlib; json.loads(pathlib.Path('conformance/disclosure-revocation.json').read_text()); json.loads(pathlib.Path('schemas/eigiib-e14-a4-disclosure-revocation.schema.json').read_text()); tomllib.loads(pathlib.Path('EIGIIB.toml').read_text())"
