name: P1-A18 deployed release governance separation of duties and emergency override replay

on:
  pull_request:
    branches: [agent/p1-a17-replication-retention-restore-durable-availability]

permissions:
  contents: read

concurrency:
  group: p1-a18-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  GOTOOLCHAIN: local

jobs:
  governance-replay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.14'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache: false
      - name: Expose macOS OpenSSL 3
        if: runner.os == 'macOS'
        shell: bash
        run: echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Expose Windows OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidate = 'C:\Program Files\Git\usr\bin'
          if (!(Test-Path "$candidate\openssl.exe")) { throw 'OpenSSL unavailable' }
          $candidate | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Capabilities
        shell: bash
        run: |
          python --version
          go version
          openssl version
      - name: Python contract and mutation tests
        shell: bash
        run: python -m unittest -v tests/test_eigiib_p1_a18_governance.py
      - name: Exact reference report
        shell: bash
        run: |
          python tools/eigiib_p1_a18_check.py --output actual-report.json >/dev/null
          python - <<'PY'
          from pathlib import Path
          if Path('tests/fixtures/p1-a18/expected-report.json').read_bytes() != Path('actual-report.json').read_bytes():
              raise SystemExit('report differs')
          PY
      - name: Closed schema and semantic validation
        shell: bash
        run: python tools/eigiib_p1_a18_schema_check.py
      - name: Independent Go tests
        shell: bash
        run: cd independent && go test ./p1governance ./cmd/eigiib-p1-governance-adapter
      - name: Independent Go report
        shell: bash
        run: cd independent && go run ./cmd/eigiib-p1-governance-adapter --root .. > ../go-report.json
      - name: Python and Go exact convergence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected=json.loads(Path('tests/fixtures/p1-a18/expected-report.json').read_text())
          actual=json.loads(Path('go-report.json').read_text())
          if expected != actual: raise SystemExit('independent report differs')
          PY
      - name: No private key in P1-A18 scope
        shell: bash
        run: |
          pattern='BEGIN PRIVATE'' KEY'
          ! grep -R -n --binary-files=without-match "$pattern" docs/P1-A18-* conformance/P1-A18-* conformance/p1-a18-* schemas/eigiib-p1-a18-* tests/fixtures/p1-a18 tests/test_eigiib_p1_a18_* tools/eigiib_p1_a18_* independent/p1governance independent/cmd/eigiib-p1-governance-adapter
      - name: No methodology-specific terminology
        shell: bash
        run: |
          pattern_one="$(printf '\110\124\053\116\124')"
          pattern_two="$(printf '\110\145\171\164\151\156\147.\102\145\163\164\145\157\144')"
          pattern_three="$(printf '\116\106/\116\124')"
          ! grep -R -n -E "${pattern_one}|${pattern_two}|${pattern_three}" docs/P1-A18-* conformance/P1-A18-* conformance/p1-a18-* schemas/eigiib-p1-a18-* tests/fixtures/p1-a18 tests/test_eigiib_p1_a18_* tools/eigiib_p1_a18_* independent/p1governance independent/cmd/eigiib-p1-governance-adapter

  governed-fixture-promotion:
    needs: governance-replay
    runs-on: ubuntu-24.04
    environment:
      name: p1-a18-fixture-production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.14'
      - name: Execute normal governed promotion fixture
        shell: bash
        run: python tools/eigiib_p1_a18_check.py --path normal --output normal-promotion.json
      - name: Execute reviewed emergency override fixture
        shell: bash
        run: python tools/eigiib_p1_a18_check.py --path emergency --output emergency-promotion.json
      - name: Assert bounded fixture status
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          normal=json.loads(Path('normal-promotion.json').read_text())
          emergency=json.loads(Path('emergency-promotion.json').read_text())
          if normal['result']!='accepted' or emergency['result']!='accepted-and-reviewed':
              raise SystemExit('fixture promotion failed')
          PY
