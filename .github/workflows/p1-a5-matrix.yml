name: P1-A5 verifier matrix

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reference-differential:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache: false
      - name: Python matrix tests
        run: python -m unittest tests/test_eigiib_verifier_matrix.py tests/test_eigiib_verifier_matrix_hardening.py -v
      - name: Independent Go tests
        working-directory: independent
        run: go test ./...
      - name: Reference and differential replay
        run: python tools/eigiib_verifier_matrix.py check . --go go --openssl openssl --json
      - name: Exact independent source closure
        run: python tools/eigiib_verifier_matrix_hardening_check.py . --go go --openssl openssl --json

  independent-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache: false
      - name: Independent verifier tests
        working-directory: independent
        run: go test ./...
      - name: Exact independent replay
        working-directory: independent
        run: go run ./cmd/eigiib-p1-independent -root .. -expected ../tests/fixtures/p1-a5/expected-independent-result.json
