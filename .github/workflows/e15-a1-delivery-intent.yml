name: E15-A1 historical authority replay

on:
  pull_request:
    paths:
      - 'extensions/E15-*'
      - 'tools/eigiib_historical_e15_a1_replay.py'
      - 'tools/eigiib_delivery_evidence_check.py'
      - 'schemas/eigiib-e15-a2-*'
      - 'conformance/delivery-evidence.json'
      - 'conformance/e15-a2-*'
      - 'conformance/E15-A2-*'
      - 'tests/test_eigiib_delivery_evidence.py'
      - 'tests/fixtures/e15-a2/**'
      - 'docs/E15-A2-*'
      - 'EIGIIB.toml'
      - 'conformance/extension-graph.json'
      - '.github/workflows/e15-a1-delivery-intent.yml'
      - '.github/workflows/e15-a2-delivery-evidence.yml'
      - '.github/workflows/eigiib.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-e15-a1:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Exact E15-A1 historical replay
        shell: bash
        run: |
          python tools/eigiib_historical_e15_a1_replay.py . --json > historical-e15-a1-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('historical-e15-a1-report.json').read_text(encoding='utf-8'))
          required=('ancestry_result','historical_e14_result','e15_a1_result','unit_test_result','overall_result')
          if any(report.get(key) != 'conformant' for key in required):
              raise SystemExit('historical E15-A1 replay is not conformant')
          PY
      - name: Exact E15-A1 ancestry
        shell: bash
        run: git merge-base --is-ancestor ca0dfde0efcee975ef4957f604d4954b6de07e01 HEAD
