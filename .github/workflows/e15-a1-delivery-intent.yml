name: E15-A1 historical continuity and delivery intent

on:
  pull_request:
    paths:
      - 'extensions/E15-*'
      - 'tools/eigiib_delivery_intent_check.py'
      - 'tools/eigiib_historical_e14_replay.py'
      - 'tools/eigiib_extension_graph_check.py'
      - 'schemas/eigiib-e15-a1-*'
      - 'conformance/delivery-intent.json'
      - 'conformance/e15-a1-*'
      - 'conformance/E15-A1-*'
      - 'tests/test_eigiib_delivery_intent.py'
      - 'tests/fixtures/e15-a1/**'
      - 'docs/E15-A1-*'
      - 'EIGIIB.toml'
      - 'conformance/extension-graph.json'
      - '.github/workflows/e15-a1-delivery-intent.yml'
      - '.github/workflows/eigiib.yml'
      - '.github/workflows/e14-a2-disclosure-authorization.yml'
      - '.github/workflows/e14-a3-correlation-control.yml'
      - '.github/workflows/e14-a4-disclosure-revocation.yml'
      - '.github/workflows/e14-a5-final-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delivery-intent:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Historical E14 authority replay
        shell: bash
        run: |
          python tools/eigiib_historical_e14_replay.py . \
            --output-dir .e15-history/components \
            --matrix-output .e15-history/e14-a5-matrix.json \
            --json > .e15-history-report.json
      - name: E15-A1 unit tests
        run: python -m unittest -v tests/test_eigiib_delivery_intent.py
      - name: Delivery-intent report
        shell: bash
        run: |
          python tools/eigiib_delivery_intent_check.py . \
            --history-report .e15-history-report.json \
            --json > actual-e15-a1-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          actual=json.loads(Path('actual-e15-a1-report.json').read_text(encoding='utf-8'))
          expected=json.loads(Path('tests/fixtures/e15-a1/expected-report.json').read_text(encoding='utf-8'))
          if actual != expected:
              raise SystemExit('E15-A1 report mismatch')
          PY
      - name: Parse E15-A1 authorities
        run: |
          python -c "import json,tomllib,pathlib; [json.loads(pathlib.Path(p).read_text(encoding='utf-8')) for p in ['conformance/delivery-intent.json','conformance/e15-a1-adoption-transition.json','conformance/e15-a1-authority-freeze.json','schemas/eigiib-e15-a1-delivery-intent.schema.json','schemas/eigiib-e15-a1-adoption-transition.schema.json','schemas/eigiib-e15-a1-authority-freeze.schema.json','conformance/extension-graph.json']]; tomllib.loads(pathlib.Path('EIGIIB.toml').read_text(encoding='utf-8'))"
      - name: Exact M0-A6 ancestry
        shell: bash
        run: git merge-base --is-ancestor 9cff4c1e392b6661af4b01e710f10342fe2ad402 HEAD
      - name: Exact historical E14 ancestry
        shell: bash
        run: git merge-base --is-ancestor 472e14fbb3d92205eabf10438e90295e19125ea4 HEAD
      - name: E14 semantic authorities remain unmodified
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          forbidden = ('extensions/E14-', 'schemas/eigiib-e14-', 'conformance/e14-', 'conformance/confidential-evidence.json', 'conformance/disclosure-', 'conformance/correlation-control.json', 'tools/eigiib_confidential_', 'tools/eigiib_disclosure_', 'tools/eigiib_correlation_', 'tools/eigiib_e14_release_')
          changed=subprocess.check_output(['git','diff','--name-only','9cff4c1e392b6661af4b01e710f10342fe2ad402','HEAD'], text=True).splitlines()
          bad=[p for p in changed if p.startswith(forbidden)]
          if bad:
              raise SystemExit('E14 semantic authority mutation: ' + ', '.join(bad))
          PY
