name: E15-A5 final closure and independent external-evidence matrix

on:
  pull_request:
    paths:
      - 'extensions/E15-A5-*'
      - 'extensions/E15-EXTERNALLY-*'
      - 'tools/eigiib_e15_*.py'
      - 'tools/eigiib_historical_e15_a4_replay.py'
      - 'tools/eigiib_*delivery*_check.py'
      - 'tools/eigiib_publication_readback_check.py'
      - 'tools/eigiib_withdrawal_governance_check.py'
      - 'schemas/eigiib-e15-a5-*'
      - 'conformance/e15-a5-*'
      - 'conformance/e15-final-closure.json'
      - 'conformance/E15-A5-*'
      - 'tests/test_eigiib_e15_*.py'
      - 'tests/test_eigiib_publication_readback.py'
      - 'tests/test_eigiib_withdrawal_governance.py'
      - 'tests/fixtures/e15-a5/**'
      - 'docs/E15-A5-*'
      - 'docs/E15-FINAL-CLOSURE-REPORT.md'
      - 'EIGIIB.toml'
      - 'conformance/extension-graph.json'
      - '.github/workflows/e15-a4-withdrawal-governance.yml'
      - '.github/workflows/e15-a5-final-closure.yml'
      - '.github/workflows/eigiib.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-closure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Historical E15-A4 authority replay
        shell: bash
        run: python tools/eigiib_historical_e15_a4_replay.py . --json > historical-e15-a4-report.json
      - name: E15-A5 unit tests
        run: python -m unittest -v tests/test_eigiib_e15_verifier_matrix.py tests/test_eigiib_e15_final_closure.py
      - name: Independent verifier matrix
        shell: bash
        run: |
          python tools/eigiib_e15_verifier_matrix.py . --json > actual-e15-a5-matrix.json
          python - <<'PY'
          import json
          from pathlib import Path
          actual=json.loads(Path('actual-e15-a5-matrix.json').read_text(encoding='utf-8'))
          expected=json.loads(Path('tests/fixtures/e15-a5/expected-matrix-report.json').read_text(encoding='utf-8'))
          if actual != expected:
              raise SystemExit('E15-A5 matrix report mismatch')
          PY
      - name: Final E15 closure report
        shell: bash
        run: |
          python tools/eigiib_e15_final_closure_check.py . --history-report historical-e15-a4-report.json --json > actual-e15-a5-closure.json
          python - <<'PY'
          import json
          from pathlib import Path
          actual=json.loads(Path('actual-e15-a5-closure.json').read_text(encoding='utf-8'))
          expected=json.loads(Path('tests/fixtures/e15-a5/expected-closure-report.json').read_text(encoding='utf-8'))
          if actual != expected:
              raise SystemExit('E15-A5 closure report mismatch')
          PY
      - name: Parse final authorities
        run: |
          python -c "import json,tomllib,pathlib; [json.loads(pathlib.Path(p).read_text(encoding='utf-8')) for p in ['conformance/e15-final-closure.json','conformance/e15-a5-verifier-matrix.json','conformance/e15-a5-adoption-transition.json','conformance/e15-a5-authority-freeze.json','schemas/eigiib-e15-a5-final-closure.schema.json','schemas/eigiib-e15-a5-verifier-matrix.schema.json','schemas/eigiib-e15-a5-adoption-transition.schema.json','schemas/eigiib-e15-a5-authority-freeze.schema.json','conformance/extension-graph.json']]; tomllib.loads(pathlib.Path('EIGIIB.toml').read_text(encoding='utf-8'))"
      - name: Exact E15-A4 ancestry
        shell: bash
        run: git merge-base --is-ancestor fce0ba52930e32069b54ab8f5634501a130222a7 HEAD
