name: P1-A8 exact distribution and independent publication replay

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  exact-distribution:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: ubuntu-24.04
          - os: macos-15
            platform: macos-15
          - os: windows-2025
            platform: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.14'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache: false
      - name: Expose macOS OpenSSL 3
        if: runner.os == 'macOS'
        shell: bash
        run: |
          candidate="$(brew --prefix openssl@3)/bin"
          test -x "$candidate/openssl"
          echo "$candidate" >> "$GITHUB_PATH"
      - name: Expose Windows OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidate = 'C:\Program Files\Git\usr\bin'
          if (!(Test-Path "$candidate\openssl.exe")) {
            throw 'Git for Windows OpenSSL is unavailable'
          }
          $candidate | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Distribution capabilities
        shell: bash
        run: |
          python --version
          go version
          openssl version
          git --version
          printf 'ImageOS=%s\nImageVersion=%s\nRUNNER_OS=%s\nRUNNER_ARCH=%s\n' "$ImageOS" "$ImageVersion" "$RUNNER_OS" "$RUNNER_ARCH"
      - name: P1-A8 Python contract tests
        run: python -m unittest tests/test_eigiib_p1_a8_distribution.py -v
      - name: Independent Go distribution tests
        working-directory: independent
        run: go test ./...
      - name: Reference Python publication
        run: >-
          python tools/eigiib_p1_a8_distribution.py .
          --policy tests/fixtures/p1-a8/release-policy.json
          --out-dir dist/reference --json
      - name: Independent Go publication
        working-directory: independent
        run: >-
          go run ./cmd/eigiib-p1-distribution
          --root ..
          --policy ../tests/fixtures/p1-a8/release-policy.json
          --out-dir ../dist/independent --json
      - name: Independent publication replay and release measurement
        shell: bash
        run: >-
          python tools/eigiib_p1_a8_publication_replay.py .
          --policy tests/fixtures/p1-a8/release-policy.json
          --reference-dir dist/reference
          --independent-dir dist/independent
          --platform ${{ matrix.platform }}
          --expected-release tests/fixtures/p1-a8/expected-release.json
          --expected-sha256sums tests/fixtures/p1-a8/expected-SHA256SUMS
          --expected-report tests/fixtures/p1-a8/expected-publication-report.json
          --json
