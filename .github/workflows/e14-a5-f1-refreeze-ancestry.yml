name: E14-A5-F1 refreeze dedicated ancestry workflows

on:
  pull_request:
    paths:
      - '.github/workflows/e14-a5-f1-refreeze-ancestry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refreeze:
    if: github.head_ref == 'agent/e14-a5-f1-portable-authority-rebind-workflow-neutral-publication'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Refreeze A2 and A3 dedicated workflows
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json

          freeze_path = Path('conformance/e14-a5-authority-freeze.json')
          freeze = json.loads(freeze_path.read_text(encoding='utf-8'))
          indexed = {item['path']: item for item in freeze['authorities']}
          for rel in [
              '.github/workflows/e14-a2-disclosure-authorization.yml',
              '.github/workflows/e14-a3-correlation-control.yml',
          ]:
              data = Path(rel).read_bytes()
              indexed[rel]['bytes'] = len(data)
              indexed[rel]['sha256'] = sha256(data).hexdigest()
              print(f'REFROZEN {rel} bytes={len(data)} sha256={indexed[rel]["sha256"]}')
          freeze_path.write_text(json.dumps(freeze, indent=2) + '\n', encoding='utf-8', newline='\n')
          PY
      - name: Validate final authority freeze
        shell: bash
        run: |
          python tools/eigiib_e14_release_check.py . --json > report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('report.json').read_text(encoding='utf-8'))
          if report['authority_freeze_result'] != 'conformant' or report['structural_result'] != 'conformant':
              raise SystemExit(json.dumps(report, indent=2))
          PY
      - name: Publish refrozen authority manifest
        shell: bash
        run: |
          git config user.name 'eigiib-closure-bot'
          git config user.email 'eigiib-closure-bot@users.noreply.github.com'
          git add conformance/e14-a5-authority-freeze.json
          git commit -m 'E14-A5-F1: refreeze dedicated ancestry workflows'
          git push origin HEAD:"${{ github.head_ref }}"
