name: M0-A12-F3 multi-observer differential continuity and custodian succession
run-name: M0-A12-F3 / ${{ github.event.pull_request.head.ref || github.ref_name }} / ${{ github.sha }}

on:
  pull_request:
    branches:
      - agent/m0-a12-f2-independent-observation-continuity-lapse-detection-long-horizon-preservation-accumulation
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/m0-a12-f3-multi-observer-succession.yml"
      - "conformance/M0-A12-F3-*"
      - "conformance/m0-a12-f3-*"
      - "docs/M0-A12-F3-*"
      - "schemas/eigiib-m0-a12-f3-*"
      - "tests/fixtures/m0-a12-f3/**"
      - "tests/test_eigiib_m0_a12_f3.py"
      - "tools/eigiib_m0_a12_f3_*.py"
      - "evidence/m0-a12-f3/**"
  workflow_dispatch:
    inputs:
      require_verified:
        description: Fail unless real paired observations and succession replay close F3
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validate:
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.14"
      - name: Install pinned cryptographic verifier
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-input cryptography==46.0.4
      - name: Inherited M0-A12, F1 and F2 suites
        shell: bash
        run: |
          python -m unittest -v tests/test_eigiib_m0_a12.py
          python -m unittest -v tests/test_eigiib_m0_a12_f1.py
          python -m unittest -v tests/test_eigiib_m0_a12_f2.py
      - name: M0-A12-F3 differential and succession suite
        shell: bash
        run: python -m unittest -v tests/test_eigiib_m0_a12_f3.py
      - name: Canonical blocked baseline
        shell: bash
        run: |
          python tools/eigiib_m0_a12_f3_check.py . --output m0-a12-f3-baseline-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected=json.loads(Path('tests/fixtures/m0-a12-f3/expected-baseline-report.json').read_text(encoding='utf-8'))
          actual=json.loads(Path('m0-a12-f3-baseline-report.json').read_text(encoding='utf-8'))
          if actual != expected:
              raise SystemExit('M0-A12-F3 canonical baseline report mismatch')
          PY
      - name: Replay remains fail-closed before F2 accumulation
        shell: bash
        run: |
          set +e
          python tools/eigiib_m0_a12_f3_check.py . --require-verified >/tmp/m0-a12-f3-require.json
          rc=$?
          set -e
          test "$rc" -eq 2
      - name: Python tools compile
        shell: bash
        run: python -m py_compile tools/eigiib_m0_a12_f3_canonical.py tools/eigiib_m0_a12_f3_replay.py tools/eigiib_m0_a12_f3_check.py
      - name: Closed JSON authorities and schemas parse
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths=list(Path('conformance').glob('m0-a12-f3-*.json'))
          paths+=list(Path('schemas').glob('eigiib-m0-a12-f3-*.json'))
          paths+=list(Path('tests/fixtures/m0-a12-f3').glob('*.json'))
          for path in paths: json.loads(path.read_text(encoding='utf-8'))
          PY
      - name: No committed live F3 evidence or secrets
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.require_verified }}
        shell: bash
        run: |
          test ! -e evidence/m0-a12-f3
          ! find conformance docs schemas tests tools -type f \( -iname '*private*key*' -o -iname '*token*' -o -iname '*secret*' \) -print -quit | grep .
          pattern='BEGIN OPENSSH PRIVATE'' KEY'
          ! grep -R -n --binary-files=without-match "$pattern" conformance/M0-A12-F3-* conformance/m0-a12-f3-* docs/M0-A12-F3-* schemas/eigiib-m0-a12-f3-* tests/fixtures/m0-a12-f3 tests/test_eigiib_m0_a12_f3.py tools/eigiib_m0_a12_f3_*.py
      - name: Require live verified replay when explicitly requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.require_verified }}
        shell: bash
        run: python tools/eigiib_m0_a12_f3_check.py . --require-verified
