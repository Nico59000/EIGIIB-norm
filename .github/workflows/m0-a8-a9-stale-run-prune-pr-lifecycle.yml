name: M0-A8/M0-A9 stale run prune with PR lifecycle

on:
  push:
    branches:
      - ops/m0-a8-a9-stale-run-prune-pr-lifecycle

permissions:
  actions: write
  contents: write
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      CURRENT_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Wait for an explicitly closed pull request
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']
          branch = os.environ['BRANCH']
          owner = repo.split('/', 1)[0]
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'eigiib-pr-lifecycle-pruner',
          }
          query = urllib.parse.urlencode({
              'state': 'closed',
              'head': f'{owner}:{branch}',
              'per_page': 10,
          })
          url = f'https://api.github.com/repos/{repo}/pulls?{query}'
          for _ in range(120):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  pulls = json.load(response)
              if pulls:
                  print(f'closed PR observed: #{pulls[0]["number"]}')
                  break
              time.sleep(2)
          else:
              raise SystemExit('closed PR association was not observed; refusing branch deletion')
          PY

      - name: Delete superseded M0-A8 and M0-A9 runs
        shell: bash
        run: |
          python - <<'PY'
          import os, urllib.error, urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'eigiib-pr-lifecycle-pruner',
          }
          for run_id in (30859976812, 30856335739):
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/runs/{run_id}',
                  headers=headers,
                  method='DELETE',
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      status = response.status
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      status = 404
                  else:
                      raise
              if status not in (204, 404):
                  raise SystemExit(f'unexpected deletion status for {run_id}: {status}')
              print(f'run {run_id}: {status}')
          PY

      - name: Remove non-current runs created for this technical branch
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']
          branch = os.environ['BRANCH']
          current = int(os.environ['CURRENT_RUN_ID'])
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'eigiib-pr-lifecycle-pruner',
          }

          def request(url, method='GET'):
              req = urllib.request.Request(url, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = response.read()
                      return response.status, json.loads(data) if data else None
              except urllib.error.HTTPError as exc:
                  if exc.code in (404, 409):
                      return exc.code, None
                  raise

          query = urllib.parse.urlencode({'branch': branch, 'per_page': 100})
          _, payload = request(f'https://api.github.com/repos/{repo}/actions/runs?{query}')
          candidates = [run for run in payload.get('workflow_runs', []) if run['id'] != current]
          for run in candidates:
              if run['status'] != 'completed':
                  request(f'https://api.github.com/repos/{repo}/actions/runs/{run["id"]}/cancel', 'POST')
          for _ in range(60):
              remaining = []
              for run in candidates:
                  status, doc = request(f'https://api.github.com/repos/{repo}/actions/runs/{run["id"]}')
                  if status == 404:
                      continue
                  if doc['status'] != 'completed':
                      remaining.append(run)
                      continue
                  request(f'https://api.github.com/repos/{repo}/actions/runs/{run["id"]}', 'DELETE')
              if not remaining:
                  break
              candidates = remaining
              time.sleep(2)
          else:
              raise SystemExit('technical branch runs did not become deletable')
          PY

      - name: Delete technical branch after PR closure
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os, urllib.parse, urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']
          branch = urllib.parse.quote(os.environ['BRANCH'], safe='')
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/git/refs/heads/{branch}',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'eigiib-pr-lifecycle-pruner',
              },
              method='DELETE',
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 204:
                  raise SystemExit(f'unexpected ref deletion status: {response.status}')
          print('technical branch deleted after closed PR association')
          PY
