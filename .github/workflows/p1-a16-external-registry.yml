name: P1-A16 external registry and cross-registry replay

on:
  pull_request:
    branches: [agent/p1-a15-live-github-release-immutable-asset-api-readback]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  GOTOOLCHAIN: local

jobs:
  external-registry-replay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.14'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache: false
      - name: Expose macOS OpenSSL 3
        if: runner.os == 'macOS'
        shell: bash
        run: |
          candidate="$(brew --prefix openssl@3)/bin"
          test -x "$candidate/openssl"
          echo "$candidate" >> "$GITHUB_PATH"
      - name: Expose Windows OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidate = 'C:\Program Files\Git\usr\bin'
          if (!(Test-Path "$candidate\openssl.exe")) { throw 'Git for Windows OpenSSL is unavailable' }
          $candidate | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install locked ORAS CLI
        shell: bash
        run: |
          set -euo pipefail
          go install oras.land/oras/cmd/oras@v1.3.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Distribution capabilities
        shell: bash
        run: |
          set -euo pipefail
          python --version
          go version
          openssl version
          "$(go env GOPATH)/bin/oras" version
      - name: Python contract and mutation tests
        shell: bash
        run: python -m unittest -v tests/test_eigiib_p1_a16_external_registry.py
      - name: Exact reference report
        shell: bash
        run: |
          set -euo pipefail
          python tools/eigiib_p1_a16_external_registry_check.py --output actual-report.json >/dev/null
          python - <<'PY'
          from pathlib import Path
          expected = Path("tests/fixtures/p1-a16/expected-report.json").read_text(encoding="utf-8")
          actual = Path("actual-report.json").read_text(encoding="utf-8")
          if expected != actual:
              raise SystemExit("exact reference report differs")
          PY
      - name: Independent Go contract tests
        shell: bash
        run: |
          set -euo pipefail
          cd independent
          go test ./p1registry ./cmd/eigiib-p1-registry-adapter
      - name: Reference Python public registry route
        shell: bash
        run: python tools/eigiib_p1_a16_live_readback.py > route-python.json
      - name: Independent Go public registry route
        shell: bash
        run: |
          set -euo pipefail
          cd independent
          go run ./cmd/eigiib-p1-registry-adapter --root .. --live > ../route-go.json
      - name: External ORAS public registry route
        shell: bash
        run: python tools/eigiib_p1_a16_oras_route.py > route-oras.json
      - name: Exact three-route replay
        shell: bash
        run: |
          set -euo pipefail
          python tools/eigiib_p1_a16_route_replay.py route-python.json route-go.json route-oras.json --output actual-replay.json >/dev/null
          python - <<'PY'
          from pathlib import Path
          expected = Path("tests/fixtures/p1-a16/expected-replay.json").read_text(encoding="utf-8")
          actual = Path("actual-replay.json").read_text(encoding="utf-8")
          if expected != actual:
              raise SystemExit("exact three-route replay differs")
          PY
      - name: Closed schema validation
        shell: bash
        run: python tools/eigiib_p1_a16_schema_check.py
      - name: No private key in P1-A16 artifact scope
        shell: bash
        run: |
          set -euo pipefail
          pattern='BEGIN PRIVATE'' KEY'
          ! grep -R -n --binary-files=without-match "$pattern" \
            docs/P1-A16-* conformance/P1-A16-* conformance/p1-a16-* \
            schemas/eigiib-p1-a16-* tests/fixtures/p1-a16 tests/test_eigiib_p1_a16_* \
            tools/eigiib_p1_a16_* independent/p1registry independent/cmd/eigiib-p1-registry-adapter
      - name: No methodology-specific source terminology in normative artifact scope
        shell: bash
        run: |
          set -euo pipefail
          pattern_one="$(printf '\110\124\053\116\124')"
          pattern_two="$(printf '\110\145\171\164\151\156\147.\102\145\163\164\145\157\144')"
          pattern_three="$(printf '\116\106/\116\124')"
          ! grep -R -n -E "${pattern_one}|${pattern_two}|${pattern_three}" \
            docs/P1-A16-* conformance/P1-A16-* conformance/p1-a16-* \
            schemas/eigiib-p1-a16-* tests/fixtures/p1-a16 tests/test_eigiib_p1_a16_* \
            tools/eigiib_p1_a16_* independent/p1registry independent/cmd/eigiib-p1-registry-adapter
