name: M0-A8 workflow-neutral republisher

on:
  pull_request:
    paths:
      - '.m0a8-republish.trigger'
      - '.github/workflows/m0-a8-republish.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  republish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/m0-a8-authoritative-lineage-publication-default-branch-reconciliation-pr-topology-closure
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.14'
      - name: Recover and materialize validated payload
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor fc3f8402bfbe447227f5777bad92b620c7bcb350 HEAD
          python - <<'PY'
          import base64
          import hashlib
          import io
          from pathlib import Path, PurePosixPath
          import re
          import zipfile

          source = Path('.github/workflows/m0-a8-materialize.yml').read_text(encoding='utf-8')
          match = re.search(r'payload = """([A-Za-z0-9+/=\r\n]+)"""', source)
          if not match:
              raise SystemExit('embedded M0-A8 payload not found')
          raw = base64.b64decode(match.group(1), validate=True)
          if hashlib.sha256(raw).hexdigest() != '90d444780d186a57bed099b2f95817558dab83fda915216a8398b2e4a7db24fb':
              raise SystemExit('M0-A8 payload digest mismatch')
          expected = {
              '.github/workflows/m0-a8-lineage-publication.yml',
              'conformance/M0-A8-MANUAL-REVIEW.md',
              'conformance/m0-a8-authority-freeze.json',
              'conformance/m0-a8-lineage-publication.json',
              'docs/M0-A8-AUTHORITATIVE-LINEAGE-PUBLICATION-DEFAULT-BRANCH-RECONCILIATION-AND-PR-TOPOLOGY-CLOSURE.md',
              'docs/M0-A8-HUMAN-MASTERY-GUIDE.md',
              'schemas/eigiib-m0-a8-lineage-publication.schema.json',
              'tests/fixtures/m0-a8/expected-report.json',
              'tests/test_eigiib_m0_a8.py',
              'tools/eigiib_m0_a8_check.py',
          }
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              names = set(archive.namelist())
              if names != expected:
                  raise SystemExit('M0-A8 payload member set mismatch')
              for name in names:
                  posix = PurePosixPath(name)
                  if posix.is_absolute() or '..' in posix.parts or '\\' in name:
                      raise SystemExit(f'unsafe payload path: {name}')
              archive.extractall(Path('.'))
          staging = Path('staging/m0-a8-lineage-publication.yml')
          staging.parent.mkdir(parents=True, exist_ok=True)
          staging.write_bytes(Path('.github/workflows/m0-a8-lineage-publication.yml').read_bytes())
          Path('.github/workflows/m0-a8-lineage-publication.yml').unlink()
          PY
      - name: Revalidate exact authority surface
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/eigiib_m0_a8_check.py tests/test_eigiib_m0_a8.py
          python -m unittest -v tests/test_eigiib_m0_a8.py
          python tools/eigiib_m0_a8_check.py . --json > actual-m0-a8-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          actual = json.loads(Path('actual-m0-a8-report.json').read_text(encoding='utf-8'))
          expected = json.loads(Path('tests/fixtures/m0-a8/expected-report.json').read_text(encoding='utf-8'))
          if actual != expected:
              raise SystemExit('M0-A8 report fixture mismatch')
          PY
      - name: Publish non-workflow authorities and workflow transit copy
        shell: bash
        run: |
          set -euo pipefail
          rm -f actual-m0-a8-report.json
          find tests tools -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            conformance/M0-A8-MANUAL-REVIEW.md \
            conformance/m0-a8-authority-freeze.json \
            conformance/m0-a8-lineage-publication.json \
            docs/M0-A8-AUTHORITATIVE-LINEAGE-PUBLICATION-DEFAULT-BRANCH-RECONCILIATION-AND-PR-TOPOLOGY-CLOSURE.md \
            docs/M0-A8-HUMAN-MASTERY-GUIDE.md \
            schemas/eigiib-m0-a8-lineage-publication.schema.json \
            tests/fixtures/m0-a8/expected-report.json \
            tests/test_eigiib_m0_a8.py \
            tools/eigiib_m0_a8_check.py \
            staging/m0-a8-lineage-publication.yml
          git diff --cached --check
          git commit -m 'M0-A8 publish lineage authorities without workflow mutation'
          git push origin HEAD:agent/m0-a8-authoritative-lineage-publication-default-branch-reconciliation-pr-topology-closure
