name: E16-A1 bounded authority publisher

on:
  push:
    branches:
      - agent/e16-a1-historical-authority-continuity-preservation-intent-custodian-replica-binding
    paths:
      - '.e16a1-payload/**'
      - '.github/workflows/e16-a1-bounded-publisher.yml'
  pull_request:
    branches:
      - agent/m0-a7-e16-entry-normalization-e15-authority-continuity
    paths:
      - '.e16a1-payload/**'
      - '.github/workflows/e16-a1-bounded-publisher.yml'

permissions:
  contents: write

concurrency:
  group: e16-a1-bounded-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/e16-a1-historical-authority-continuity-preservation-intent-custodian-replica-binding
          fetch-depth: 0
      - name: Materialize exact non-workflow authorities
        shell: bash
        run: |
          if ! compgen -G '.e16a1-payload/payload.b64.*' >/dev/null; then
            echo 'payload already consumed'
            exit 0
          fi
          python - <<'PY'
          import base64, hashlib, io, json, shutil, tarfile
          from pathlib import Path
          parts = sorted(Path('.e16a1-payload').glob('payload.b64.*'))
          encoded = ''.join(path.read_text(encoding='ascii') for path in parts)
          data = base64.b64decode(encoded, validate=True)
          expected = 'f663f2668c5b2d97ec486668003da8d0dc7d13dea79c23b62e3e013dcbe23c17'
          if len(data) != 35085:
              raise SystemExit(f'unexpected payload bytes: {len(data)}')
          if hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit('payload digest mismatch')
          stage = Path('.e16a1-stage')
          if stage.exists():
              shutil.rmtree(stage)
          stage.mkdir()
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as tf:
              tf.extractall(stage, filter='data')
          manifest_path = stage / '.e16a1-manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if len(manifest.get('files', [])) != 20:
              raise SystemExit('unexpected manifest file count')
          for entry in manifest['files']:
              rel = entry['path']
              src = stage / rel
              raw = src.read_bytes()
              if len(raw) != entry['bytes']:
                  raise SystemExit(f'byte count mismatch: {rel}')
              if hashlib.sha256(raw).hexdigest() != entry['sha256']:
                  raise SystemExit(f'digest mismatch: {rel}')
              target = Path(rel)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(raw)
          PY
          git rm -r .e16a1-payload
          rm -rf .e16a1-stage
          git add EIGIIB.toml conformance docs extensions schemas tests tools
          git config user.name 'EIGIIB bounded publisher'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'E16-A1: publish exact preservation authorities'
          git push origin HEAD:agent/e16-a1-historical-authority-continuity-preservation-intent-custodian-replica-binding
