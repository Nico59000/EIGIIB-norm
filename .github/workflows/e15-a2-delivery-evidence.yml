name: E15-A2 transfer evidence and recipient acknowledgement

on:
  pull_request:
    paths:
      - 'extensions/E15-*'
      - 'tools/eigiib_delivery_evidence_check.py'
      - 'tools/eigiib_historical_e15_a1_replay.py'
      - 'schemas/eigiib-e15-a2-*'
      - 'conformance/delivery-evidence.json'
      - 'conformance/e15-a2-*'
      - 'conformance/E15-A2-*'
      - 'tests/test_eigiib_delivery_evidence.py'
      - 'tests/fixtures/e15-a2/**'
      - 'docs/E15-A2-*'
      - 'EIGIIB.toml'
      - 'conformance/extension-graph.json'
      - '.github/workflows/e15-a1-delivery-intent.yml'
      - '.github/workflows/e15-a2-delivery-evidence.yml'
      - '.github/workflows/eigiib.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer-evidence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Historical E15-A1 authority replay
        shell: bash
        run: python tools/eigiib_historical_e15_a1_replay.py . --json > historical-e15-a1-report.json
      - name: E15-A2 unit tests
        run: python -m unittest -v tests/test_eigiib_delivery_evidence.py
      - name: Transfer evidence report
        shell: bash
        run: |
          python tools/eigiib_delivery_evidence_check.py . \
            --history-report historical-e15-a1-report.json \
            --json > actual-e15-a2-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          actual=json.loads(Path('actual-e15-a2-report.json').read_text(encoding='utf-8'))
          expected=json.loads(Path('tests/fixtures/e15-a2/expected-report.json').read_text(encoding='utf-8'))
          if actual != expected:
              raise SystemExit('E15-A2 report mismatch')
          PY
      - name: Parse E15-A2 authorities
        run: |
          python -c "import json,tomllib,pathlib; [json.loads(pathlib.Path(p).read_text(encoding='utf-8')) for p in ['conformance/delivery-evidence.json','conformance/e15-a2-adoption-transition.json','conformance/e15-a2-authority-freeze.json','schemas/eigiib-e15-a2-delivery-evidence.schema.json','schemas/eigiib-e15-a2-adoption-transition.schema.json','schemas/eigiib-e15-a2-authority-freeze.schema.json','conformance/extension-graph.json']]; tomllib.loads(pathlib.Path('EIGIIB.toml').read_text(encoding='utf-8'))"
      - name: Exact E15-A1 ancestry
        shell: bash
        run: git merge-base --is-ancestor ca0dfde0efcee975ef4957f604d4954b6de07e01 HEAD
      - name: E15-A1 slice-specific authorities remain unmodified
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          exact = {
            'conformance/delivery-intent.json',
            'conformance/e15-a1-adoption-transition.json',
            'conformance/e15-a1-authority-freeze.json',
            'conformance/E15-A1-MANUAL-REVIEW.md',
            'docs/E15-A1-HUMAN-MASTERY-GUIDE.md',
            'schemas/eigiib-e15-a1-adoption-transition.schema.json',
            'schemas/eigiib-e15-a1-authority-freeze.schema.json',
            'schemas/eigiib-e15-a1-delivery-intent.schema.json',
            'tests/test_eigiib_delivery_intent.py',
            'tools/eigiib_delivery_intent_check.py',
            'tools/eigiib_historical_e14_replay.py',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only','ca0dfde0efcee975ef4957f604d4954b6de07e01','HEAD'], text=True).splitlines())
          bad=sorted(exact & changed)
          bad += sorted(p for p in changed if p.startswith('tests/fixtures/e15-a1/'))
          if bad:
              raise SystemExit('E15-A1 authority mutation: ' + ', '.join(bad))
          PY
