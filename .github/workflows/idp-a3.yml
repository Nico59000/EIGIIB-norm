name: EIGIIB IDP-A3
on:
  pull_request:
    paths:
      - 'extensions/IDP-A3-*'
      - 'conformance/idp-a3-*'
      - 'schemas/idp-a3-*'
      - 'tools/eigiib_idp_a3_*'
      - 'tests/test_eigiib_idp_a3.py'
      - 'docs/IDP-A3-*'
      - '.github/workflows/idp-a3.yml'
  push:
    branches:
      - 'agent/idp-a3-audience-grants-institutional-eligibility-expiry-revocation-return-quarantine-promotion'
permissions:
  contents: read
jobs:
  idp-a3:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.14'
      - name: Install pinned schema verifier
        run: python -m pip install --disable-pip-version-check --no-input jsonschema==4.26.0
      - name: Closed schema
        run: python -c "import json; from jsonschema import Draft202012Validator as V; s=json.load(open('schemas/idp-a3-access-policy.schema.json',encoding='utf-8')); d=json.load(open('conformance/idp-a3-access-policy.json',encoding='utf-8')); V.check_schema(s); V(s).validate(d)"
      - name: Structural authorization authority
        run: python tools/eigiib_idp_a3_check.py conformance/idp-a3-access-policy.json --evaluation-at 2030-01-01T12:00:00Z --require-conformant --json
      - name: Independent authorization authority
        run: python tools/eigiib_idp_a3_independent.py conformance/idp-a3-access-policy.json --evaluation-at 2030-01-01T12:00:00Z --require-conformant --json
      - name: Differential expiry revocation promotion matrix
        run: python tools/eigiib_idp_a3_matrix.py . --json
      - name: Unit tests
        run: python -m unittest tests.test_eigiib_idp_a3 -v
