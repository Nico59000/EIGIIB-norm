name: M0-A12-F5 E17 adoption authority and final M0 freeze
run-name: M0-A12-F5 / ${{ github.event.pull_request.head.ref || github.ref_name }} / ${{ github.sha }}
on:
  pull_request:
    branches:
      - agent/m0-a12-f4-multi-authority-emergency-succession-catastrophic-recovery-e17-evidence-matrix
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/m0-a12-f5-e17-adoption-final-freeze.yml'
      - 'conformance/M0-A12-F5-*'
      - 'conformance/m0-a12-f5-*'
      - 'docs/M0-A12-F5-*'
      - 'schemas/eigiib-m0-a12-f5-*'
      - 'tests/fixtures/m0-a12-f5/**'
      - 'tests/test_eigiib_m0_a12_f5.py'
      - 'tools/eigiib_m0_a12_f5_*.py'
      - 'evidence/m0-a12-f5/**'
  workflow_dispatch:
    inputs:
      require_adopted:
        description: Fail unless E17 adoption and final M0 freeze are genuinely verified
        required: true
        default: false
        type: boolean
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
defaults:
  run:
    shell: bash
jobs:
  validate:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.14'
      - name: Install pinned cryptographic verifier
        run: python -m pip install --disable-pip-version-check --no-input cryptography==46.0.4
      - name: Inherited M0-A12 through F4 suites
        run: |
          python -m unittest -v tests/test_eigiib_m0_a12.py
          python -m unittest -v tests/test_eigiib_m0_a12_f1.py
          python -m unittest -v tests/test_eigiib_m0_a12_f2.py
          python -m unittest -v tests/test_eigiib_m0_a12_f3.py
          python -m unittest -v tests/test_eigiib_m0_a12_f4.py
      - name: M0-A12-F5 adoption and freeze suite
        run: python -m unittest -v tests/test_eigiib_m0_a12_f5.py
      - name: Canonical blocked baseline
        run: |
          python tools/eigiib_m0_a12_f5_check.py . --output m0-a12-f5-baseline.json
          python - <<'PY'
          import json
          from pathlib import Path
          actual=json.loads(Path('m0-a12-f5-baseline.json').read_text())
          expected=json.loads(Path('tests/fixtures/m0-a12-f5/expected-baseline-report.json').read_text())
          assert actual==expected
          PY
      - name: Adoption remains fail-closed
        run: |
          set +e
          python tools/eigiib_m0_a12_f5_check.py . --require-adopted >/tmp/f5.json
          rc=$?
          set -e
          test "$rc" -eq 2
      - name: Python tools compile
        run: python -m py_compile tools/eigiib_m0_a12_f5_*.py
      - name: Closed JSON and schemas parse
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths=list(Path('conformance').glob('m0-a12-f5-*.json'))+list(Path('schemas').glob('eigiib-m0-a12-f5-*.json'))+list(Path('tests/fixtures/m0-a12-f5').glob('*.json'))
          for p in paths: json.loads(p.read_text())
          PY
      - name: No committed live F5 evidence or secrets
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.require_adopted }}
        run: |
          test ! -e evidence/m0-a12-f5
          ! find conformance docs schemas tests tools -type f \( -iname '*private*key*' -o -iname '*token*' -o -iname '*secret*' \) -print -quit | grep .
      - name: Require live adopted state when explicitly requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.require_adopted }}
        run: python tools/eigiib_m0_a12_f5_check.py . --require-adopted
