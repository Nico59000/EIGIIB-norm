name: P1-A6 external native bridge

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bridge-differential:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache: false
      - name: P1-A6 Python contract tests
        run: python -m unittest tests/test_eigiib_external_verifier_bridge.py -v
      - name: P1-A5 exact baseline closure
        run: python tools/eigiib_verifier_matrix_hardening_check.py . --go go --openssl openssl --json
      - name: External bridge Go tests
        working-directory: external
        run: go test ./...
      - name: External native differential replay
        run: python tools/eigiib_external_verifier_bridge.py . --go go --openssl openssl --json

  external-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache: false
      - name: External bridge tests
        working-directory: external
        run: go test ./...
      - name: Exact external observation
        working-directory: external
        run: go run ./cmd/eigiib-p1-external -root .. -expected ../tests/fixtures/p1-a6/expected-external-result.json
