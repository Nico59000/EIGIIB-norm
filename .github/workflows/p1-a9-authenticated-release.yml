name: P1-A9 authenticated release and supersession replay

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  release-replay:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: ubuntu-24.04
          - os: macos-15
            platform: macos-15
          - os: windows-2025
            platform: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.14'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache: false
      - name: Expose macOS OpenSSL 3
        if: runner.os == 'macOS'
        shell: bash
        run: |
          candidate="$(brew --prefix openssl@3)/bin"
          test -x "$candidate/openssl"
          echo "$candidate" >> "$GITHUB_PATH"
      - name: Expose Windows OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidate = 'C:\Program Files\Git\usr\bin'
          if (!(Test-Path "$candidate\openssl.exe")) { throw 'Git for Windows OpenSSL is unavailable' }
          $candidate | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Distribution capabilities
        shell: bash
        run: |
          python --version
          go version
          openssl version
          git --version
      - name: P1-A9 Python contract tests
        run: python -m unittest tests/test_eigiib_p1_a9_release.py -v
      - name: Independent Go release tests
        working-directory: independent
        run: go test ./p1release ./cmd/eigiib-p1-release-adapter
      - name: External go-cose release tests
        working-directory: external
        run: go test ./p1release ./cmd/eigiib-p1-release-adapter
      - name: Exact three-route P1-A9 replay
        shell: bash
        run: >-
          python tools/eigiib_p1_a9_route_replay.py .
          --capsule tests/fixtures/p1-a9/capsule.json
          --release tests/fixtures/p1-a8/expected-release.json
          --release-key tests/fixtures/p1-a9/release-public-key.pem
          --ts-key tests/fixtures/p1-a9/ts-public-key.pem
          --expected tests/fixtures/p1-a9/expected-replay.json
          --go go --openssl openssl --json
