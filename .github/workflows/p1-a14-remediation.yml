name: P1-A14 advisory remediation and fixed-release replay

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  remediation-replay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.14'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache: false
      - name: Expose macOS OpenSSL 3
        if: runner.os == 'macOS'
        shell: bash
        run: |
          candidate="$(brew --prefix openssl@3)/bin"
          test -x "$candidate/openssl"
          echo "$candidate" >> "$GITHUB_PATH"
      - name: Expose Windows OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidate = 'C:\Program Files\Git\usr\bin'
          if (!(Test-Path "$candidate\openssl.exe")) { throw 'Git for Windows OpenSSL is unavailable' }
          $candidate | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Distribution capabilities
        shell: bash
        run: |
          python --version
          go version
          openssl version
      - name: Python contract and mutation tests
        run: python -m unittest tests/test_eigiib_p1_a14_remediation.py -v
      - name: Exact reference report
        run: >-
          python tools/eigiib_p1_a14_remediation_check.py .
          --capsule tests/fixtures/p1-a14/capsule.json
          --expected tests/fixtures/p1-a14/expected-report.json
          --openssl openssl --json
      - name: Independent Go remediation tests
        working-directory: independent
        run: go test ./p1remediation ./cmd/eigiib-p1-remediation-adapter
      - name: External go-cose remediation tests
        working-directory: external
        run: go test ./p1remediation ./cmd/eigiib-p1-remediation-adapter
      - name: Exact three-route replay
        run: >-
          python tools/eigiib_p1_a14_route_replay.py .
          --capsule tests/fixtures/p1-a14/capsule.json
          --expected tests/fixtures/p1-a14/expected-replay.json
          --go go --openssl openssl --json
      - name: Closed schema validation
        run: python tools/eigiib_p1_a14_schema_check.py .
      - name: No private key in P1-A14 artifact scope
        shell: bash
        run: |
          pattern='BEGIN PRIVATE'' KEY'
          ! grep -R -n "$pattern" \
            .github/workflows/p1-a14-remediation.yml \
            conformance/P1-A14-MANUAL-REVIEW.md \
            conformance/p1-a14-remediation.json \
            docs/P1-A14-ADVISORY-BINDING-REMEDIATION-LINEAGE-AND-FIXED-RELEASE-REPLAY.md \
            schemas/eigiib-p1-a14-*.json \
            tests/fixtures/p1-a14 \
            tests/test_eigiib_p1_a14_remediation.py \
            tools/eigiib_p1_a14_*.py \
            independent/p1remediation independent/cmd/eigiib-p1-remediation-adapter \
            external/p1remediation external/cmd/eigiib-p1-remediation-adapter
