name: E14-A5-F1 aggregate report ordering

on:
  pull_request:
    paths:
      - '.github/workflows/e14-a5-f1-aggregate-order.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/e14-a5-f1-portable-authority-rebind-workflow-neutral-publication'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Repair aggregate report ordering and refreeze workflow
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json

          workflow = Path('.github/workflows/eigiib.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start_marker = '      - name: EIGIIB E14-A5 independent verifier matrix'
          end_marker = '      - name: EIGIIB M0-A2 aggregate conformance'
          f1_marker = '      - name: EIGIIB E14-A5-F1 portable authority rebinding conformance'
          if f1_marker not in lines:
              start = lines.index(start_marker)
              end = lines.index(end_marker)
              replacement = [
                  f1_marker,
                  '        if: always()',
                  '        run: |',
                  '          set -o pipefail',
                  '          python tools/eigiib_e14_release_check.py . --json | tee .eigiib-results/components/e14-a5-f1.json',
                  start_marker,
                  '        if: always()',
                  '        run: |',
                  '          set -o pipefail',
                  '          python tools/eigiib_e14_release_matrix.py . --json | tee .eigiib-results/e14-a5-matrix.json',
              ]
              lines[start:end] = replacement
              workflow.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')

          data = workflow.read_bytes()
          freeze_path = Path('conformance/e14-a5-authority-freeze.json')
          freeze = json.loads(freeze_path.read_text(encoding='utf-8'))
          entry = next(item for item in freeze['authorities'] if item['path'] == '.github/workflows/eigiib.yml')
          entry['bytes'] = len(data)
          entry['sha256'] = sha256(data).hexdigest()
          freeze_path.write_text(json.dumps(freeze, indent=2) + '\n', encoding='utf-8', newline='\n')
          print(f"GLOBAL_WORKFLOW bytes={len(data)} sha256={entry['sha256']}")
          PY
      - name: Replay full tests and aggregate
        shell: bash
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          rm -rf .eigiib-results
          mkdir -p .eigiib-results/components
          python tools/eigiib_extension_graph_check.py . --json > .eigiib-results/components/m0-a1.json
          python tools/eigiib_check.py . --json > .eigiib-results/components/e2.json
          python tools/eigiib_provenance_check.py . --json > .eigiib-results/components/e3.json
          python tools/eigiib_trust_check.py . --crypto-provider openssl --json > .eigiib-results/components/e4.json
          python tools/eigiib_transparency_check.py . --json > .eigiib-results/components/e5.json
          python tools/eigiib_gossip_check.py . --json > .eigiib-results/components/e6.json
          python tools/eigiib_recovery_check.py . --json > .eigiib-results/components/e7.json
          python tools/eigiib_recovery_hardening_check.py . --json > .eigiib-results/components/e7-h0.2.json
          python tools/eigiib_convergence_check.py . --json > .eigiib-results/components/e8.json
          python tools/eigiib_degraded_check.py . --json > .eigiib-results/components/e9.json
          python tools/eigiib_degraded_hardening_check.py . --json > .eigiib-results/components/e9-h0.2.json
          python tools/eigiib_automation_check.py . --json > .eigiib-results/components/e10.json
          python tools/eigiib_automation_hardening_check.py . --json > .eigiib-results/components/e10-h0.2.json
          python tools/eigiib_temporal_check.py . --json > .eigiib-results/components/e11.json
          python tools/eigiib_temporal_hardening_check.py . --json > .eigiib-results/components/e11-h0.2.json
          python tools/eigiib_commit_check.py . --json > .eigiib-results/components/e12.json
          python tools/eigiib_commit_hardening_check.py . --json > .eigiib-results/components/e12-h0.2.json
          python tools/eigiib_policy_composition_check.py . --json > .eigiib-results/components/e13.json
          python tools/eigiib_policy_composition_hardening_check.py . --json > .eigiib-results/components/e13-h0.2.json
          python tools/eigiib_confidential_evidence_check.py . --json > .eigiib-results/components/e14.json
          python tools/eigiib_disclosure_authorization_check.py . --json > .eigiib-results/components/e14-a2.json
          python tools/eigiib_correlation_control_check.py . --json > .eigiib-results/components/e14-a3.json
          python tools/eigiib_disclosure_revocation_check.py . --json > .eigiib-results/components/e14-a4.json
          python tools/eigiib_e14_release_check.py . --json > .eigiib-results/components/e14-a5.json
          python tools/eigiib_e14_release_check.py . --json > .eigiib-results/components/e14-a5-f1.json
          python tools/eigiib_e14_release_matrix.py . --json > .eigiib-results/e14-a5-matrix.json
          python tools/eigiib_aggregate.py . --json > .eigiib-results/aggregate.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('.eigiib-results/aggregate.json').read_text(encoding='utf-8'))
          if report['overall_result'] != 'conformant':
              raise SystemExit(json.dumps(report, indent=2))
          if report['summary']['expected'] != 25 or report['summary']['pass'] != 25:
              raise SystemExit(json.dumps(report['summary'], indent=2))
          PY
      - name: Publish one clean final head
        shell: bash
        run: |
          git config user.name 'eigiib-closure-bot'
          git config user.email 'eigiib-closure-bot@users.noreply.github.com'
          git add .github/workflows/eigiib.yml conformance/e14-a5-authority-freeze.json
          git rm .github/workflows/e14-a5-f1-aggregate-order.yml
          git commit -m 'E14-A5-F1: order aggregate reports and refreeze global workflow'
          git push origin HEAD:"${{ github.head_ref }}"
