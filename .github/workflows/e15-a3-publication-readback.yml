name: E15-A3 historical authority replay

on:
  pull_request:
    paths:
      - 'extensions/E15-*'
      - 'tools/eigiib_historical_e15_a3_replay.py'
      - 'tools/eigiib_withdrawal_governance_check.py'
      - 'schemas/eigiib-e15-a4-*'
      - 'conformance/withdrawal-governance.json'
      - 'conformance/e15-a4-*'
      - 'conformance/E15-A4-*'
      - 'tests/test_eigiib_withdrawal_governance.py'
      - 'tests/fixtures/e15-a4/**'
      - 'docs/E15-A4-*'
      - 'EIGIIB.toml'
      - 'conformance/extension-graph.json'
      - '.github/workflows/e15-a3-publication-readback.yml'
      - '.github/workflows/e15-a4-withdrawal-governance.yml'
      - '.github/workflows/eigiib.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-e15-a3:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Exact E15-A3 historical replay
        shell: bash
        run: |
          python tools/eigiib_historical_e15_a3_replay.py . --json > historical-e15-a3-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('historical-e15-a3-report.json').read_text(encoding='utf-8'))
          required=('ancestry_result','historical_e14_result','e15_a1_result','e15_a2_result','e15_a3_result','e15_a3_tests_result','overall_result')
          if any(report.get(key) != 'conformant' for key in required):
              raise SystemExit('historical E15-A3 replay is not conformant')
          PY
      - name: Exact E15-A3 ancestry
        shell: bash
        run: git merge-base --is-ancestor f403e93dd6d1dcb058474d67f2cc7e73b8ad13bd HEAD
