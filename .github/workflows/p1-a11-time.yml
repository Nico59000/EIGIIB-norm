name: P1-A11 trusted timestamp and validity replay

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  trusted-time-replay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.14'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache: false
      - name: Expose macOS OpenSSL 3
        if: runner.os == 'macOS'
        shell: bash
        run: |
          candidate="$(brew --prefix openssl@3)/bin"
          test -x "$candidate/openssl"
          echo "$candidate" >> "$GITHUB_PATH"
      - name: Expose Windows OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidate = 'C:\Program Files\Git\usr\bin'
          if (!(Test-Path "$candidate\openssl.exe")) { throw 'Git for Windows OpenSSL is unavailable' }
          $candidate | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Distribution capabilities
        shell: bash
        run: |
          python --version
          go version
          openssl version
      - name: Python contract and mutation tests
        run: python -m unittest tests/test_eigiib_p1_a11_time.py -v
      - name: Exact reference report
        run: >-
          python tools/eigiib_p1_a11_time_check.py .
          --capsule tests/fixtures/p1-a11/capsule.json
          --expected tests/fixtures/p1-a11/expected-report.json
          --openssl openssl --json
      - name: Independent Go trusted-time tests
        working-directory: independent
        run: go test ./p1time ./cmd/eigiib-p1-time-adapter
      - name: External go-cose trusted-time tests
        working-directory: external
        run: go test ./p1time ./cmd/eigiib-p1-time-adapter
      - name: Exact three-route replay
        run: >-
          python tools/eigiib_p1_a11_route_replay.py .
          --capsule tests/fixtures/p1-a11/capsule.json
          --expected tests/fixtures/p1-a11/expected-replay.json
          --go go --openssl openssl --json
      - name: Closed schema validation
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('.')
          schema_dir = root / 'schemas'
          cache = {}

          def load_schema(name):
              path = schema_dir / name
              if path not in cache:
                  value = json.loads(path.read_text(encoding='utf-8'))
                  if not isinstance(value, dict) or value.get('$schema') != 'https://json-schema.org/draft/2020-12/schema':
                      raise AssertionError(f'invalid schema carrier: {name}')
                  cache[path] = value
              return cache[path], path

          def pointer(document, fragment):
              value = document
              if fragment:
                  if not fragment.startswith('/'):
                      raise AssertionError(f'unsupported schema fragment: {fragment}')
                  for token in fragment[1:].split('/'):
                      token = token.replace('~1', '/').replace('~0', '~')
                      value = value[token]
              return value

          def resolve(ref, document, source):
              if ref.startswith('#'):
                  return pointer(document, ref[1:]), document, source
              name, _, fragment = ref.partition('#')
              target, target_source = load_schema(name)
              return pointer(target, fragment), target, target_source

          def fail(path, message):
              raise AssertionError(f'{path}: {message}')

          def validate(value, schema, document, source, path='$'):
              if '$ref' in schema:
                  target, target_document, target_source = resolve(schema['$ref'], document, source)
                  validate(value, target, target_document, target_source, path)
              for item in schema.get('allOf', []):
                  validate(value, item, document, source, path)
              if 'const' in schema and value != schema['const']:
                  fail(path, 'const')
              if 'enum' in schema and value not in schema['enum']:
                  fail(path, 'enum')

              kind = schema.get('type')
              tests = {
                  'object': lambda x: isinstance(x, dict),
                  'array': lambda x: isinstance(x, list),
                  'string': lambda x: isinstance(x, str),
                  'integer': lambda x: isinstance(x, int) and not isinstance(x, bool),
                  'boolean': lambda x: isinstance(x, bool),
                  'null': lambda x: x is None,
              }
              if kind is not None and (kind not in tests or not tests[kind](value)):
                  fail(path, f'type {kind}')

              if isinstance(value, dict):
                  required = schema.get('required', [])
                  missing = [key for key in required if key not in value]
                  if missing:
                      fail(path, f'missing {missing}')
                  properties = schema.get('properties', {})
                  if schema.get('additionalProperties') is False:
                      extra = sorted(set(value) - set(properties))
                      if extra:
                          fail(path, f'additional properties {extra}')
                  for key, child in properties.items():
                      if key in value:
                          validate(value[key], child, document, source, f'{path}.{key}')

              if isinstance(value, list):
                  if len(value) < schema.get('minItems', 0):
                      fail(path, 'minItems')
                  if 'maxItems' in schema and len(value) > schema['maxItems']:
                      fail(path, 'maxItems')
                  if schema.get('uniqueItems'):
                      encoded = [json.dumps(item, sort_keys=True, separators=(',', ':')) for item in value]
                      if len(encoded) != len(set(encoded)):
                          fail(path, 'uniqueItems')
                  item_schema = schema.get('items')
                  if isinstance(item_schema, dict):
                      for index, item in enumerate(value):
                          validate(item, item_schema, document, source, f'{path}[{index}]')

              if isinstance(value, str):
                  if len(value) < schema.get('minLength', 0):
                      fail(path, 'minLength')
                  if 'pattern' in schema and re.search(schema['pattern'], value) is None:
                      fail(path, 'pattern')

              if isinstance(value, int) and not isinstance(value, bool):
                  if 'minimum' in schema and value < schema['minimum']:
                      fail(path, 'minimum')
                  if 'maximum' in schema and value > schema['maximum']:
                      fail(path, 'maximum')

          capsule_schema, capsule_source = load_schema('eigiib-p1-a11-capsule.schema.json')
          capsule = json.loads((root / 'tests/fixtures/p1-a11/capsule.json').read_text(encoding='utf-8'))
          validate(capsule, capsule_schema, capsule_schema, capsule_source)

          replay_schema, replay_source = load_schema('eigiib-p1-a11-replay-report.schema.json')
          replay = json.loads((root / 'tests/fixtures/p1-a11/expected-replay.json').read_text(encoding='utf-8'))
          validate(replay, replay_schema, replay_schema, replay_source)
          PY
      - name: No private key in P1-A11 scope
        shell: bash
        run: |
          ! grep -R -n 'BEGIN PRIVATE KEY' \
            conformance docs schemas tests tools independent external
