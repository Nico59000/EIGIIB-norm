name: E16-A2 bounded publisher

on:
  push:
    branches:
      - agent/e16-a2-replica-placement-custody-acceptance-failure-domain-evidence
    paths:
      - '.e16a2-payload/**'
      - '.github/workflows/e16-a2-bounded-publisher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Materialize bounded payload
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import zipfile
          from pathlib import Path

          payload_dir = Path('.e16a2-payload')
          parts = sorted(payload_dir.glob('part*.b64'))
          if [p.name for p in parts] != [f'part{i:02d}.b64' for i in range(8)]:
              raise SystemExit('unexpected E16-A2 payload fragment set')
          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          raw = base64.b64decode(encoded, validate=True)
          expected_digest = 'bdb73a5b1e9d03c7d9d00262218d7bb49bf904a6f1c32b86fddfe661a47ab958'
          if hashlib.sha256(raw).hexdigest() != expected_digest:
              raise SystemExit('E16-A2 payload SHA-256 mismatch')
          if len(raw) != 26419:
              raise SystemExit('E16-A2 payload byte-count mismatch')
          archive = payload_dir / 'payload.zip'
          archive.write_bytes(raw)
          expected_members = [
              '.github/workflows/e16-a2-replica-placement.yml',
              'conformance/E16-A2-MANUAL-REVIEW.md',
              'conformance/e16-a2-adoption-transition.json',
              'conformance/e16-a2-authority-freeze.json',
              'conformance/e16-a2-authority-manifest.json',
              'conformance/replica-placement.json',
              'docs/E16-A2-HUMAN-MASTERY-GUIDE.md',
              'extensions/E16-A2-REPLICA-PLACEMENT-CUSTODY-ACCEPTANCE-FAILURE-DOMAIN-EVIDENCE.md',
              'extensions/E16-EXTERNAL-CUSTODY-REPLICATION-RETENTION-RECOVERY-GOVERNANCE.md',
              'schemas/eigiib-e16-a2-adoption-transition.schema.json',
              'schemas/eigiib-e16-a2-authority-freeze.schema.json',
              'schemas/eigiib-e16-a2-authority-manifest.schema.json',
              'schemas/eigiib-e16-a2-replica-placement.schema.json',
              'tests/fixtures/e16-a2/expected-report.json',
              'tests/test_eigiib_replica_placement.py',
              'tools/eigiib_historical_e16_a1_replay.py',
              'tools/eigiib_replica_placement_check.py',
          ]
          with zipfile.ZipFile(archive) as zf:
              names = zf.namelist()
              if names != expected_members:
                  raise SystemExit('unexpected E16-A2 archive member set or order')
              for name in names:
                  path = Path(name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe E16-A2 archive member: {name}')
              zf.extractall('.')
          PY
      - name: Validate E16-A2 closure
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/eigiib_historical_e16_a1_replay.py tools/eigiib_replica_placement_check.py
          python -m unittest -v tests/test_eigiib_replica_placement.py
          python tools/eigiib_historical_e16_a1_replay.py . --json > historical-e16-a1-report.json
          python tools/eigiib_replica_placement_check.py . \
            --history-report historical-e16-a1-report.json \
            --json > actual-e16-a2-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          actual = json.loads(Path('actual-e16-a2-report.json').read_text(encoding='utf-8'))
          expected = json.loads(Path('tests/fixtures/e16-a2/expected-report.json').read_text(encoding='utf-8'))
          if actual != expected:
              raise SystemExit('E16-A2 report mismatch')
          PY
          python tools/eigiib_extension_graph_check.py . --json > extension-graph-report.json
          git merge-base --is-ancestor 7fd50a2009c6a437c7fe0b680407cf337b55cf4f HEAD
      - name: Publish clean E16-A2 head
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .e16a2-payload
          rm -f historical-e16-a1-report.json actual-e16-a2-report.json extension-graph-report.json
          rm .github/workflows/e16-a2-bounded-publisher.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'E16-A2 replica placement and custody evidence'
          git push origin HEAD:agent/e16-a2-replica-placement-custody-acceptance-failure-domain-evidence
