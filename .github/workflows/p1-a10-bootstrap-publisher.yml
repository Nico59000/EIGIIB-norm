name: P1-A10 bootstrap payload diagnostic

on:
  pull_request:
    branches: [agent/p1-a9-authenticated-release-supersession]

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/p1-a10-bootstrap-publisher
      - name: Fragment identities
        shell: bash
        run: |
          wc -c .bootstrap/p1a10-part-*
          git hash-object .bootstrap/p1a10-part-*
      - uses: actions/upload-artifact@v4
        with:
          name: p1a10-bootstrap-fragments
          path: .bootstrap/p1a10-part-*
          if-no-files-found: error
          compression-level: 0
