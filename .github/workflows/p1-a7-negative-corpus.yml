name: P1-A7.2 portable negative replay

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  route-bound-replay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache: false
      - name: P1-A7 generator and reference adapter tests
        run: python -m unittest tests/test_eigiib_negative_vector_generator.py tests/test_eigiib_p1_a7_reference_adapter.py -v
      - name: Independent Go adapter compilation
        working-directory: independent
        run: go test ./...
      - name: External Go adapter compilation
        working-directory: external
        run: go test ./...
      - name: Exact deterministic corpus replay
        run: python tools/eigiib_negative_vector_generator.py . --json
      - name: First three-route portable error replay
        run: python tools/eigiib_negative_route_replay.py . --go go --expected tests/fixtures/p1-a7/expected-a7.2-route-replay.json --json
