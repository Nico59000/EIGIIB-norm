name: P1-A7.1 negative-vector generator

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generator-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: P1-A7.1 generator tests
        run: python -m unittest tests/test_eigiib_negative_vector_generator.py -v
      - name: Exact deterministic corpus replay
        run: python tools/eigiib_negative_vector_generator.py . --json
