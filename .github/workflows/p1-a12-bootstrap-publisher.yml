name: P1-A12 bootstrap publisher

on:
  pull_request:
    branches: [agent/p1-a11-trusted-timestamp-validity-replay]

permissions:
  contents: write

env:
  GOTOOLCHAIN: local
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/p1-a12-bootstrap-publisher
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.14'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache: false
      - name: Reconstruct exact P1-A12 payload
        shell: bash
        run: |
          cat .bootstrap/p1a12-part-{00..09}.b64 > "$RUNNER_TEMP/p1a12-payload.b64"
          base64 --decode "$RUNNER_TEMP/p1a12-payload.b64" > "$RUNNER_TEMP/p1a12-payload.tar.gz"
          printf '%s  %s\n' \
            '139f299a836608d3664edcd1c4472c25f217d0d12c5274a9686fdf550d3c332a' \
            "$RUNNER_TEMP/p1a12-payload.tar.gz" | sha256sum -c -
      - name: Validate and publish exact P1-A12 non-workflow tree
        shell: bash
        run: |
          git checkout --detach 356949456e8d4084ce317f45f5912522150ecd97
          mapfile -t files < <(tar -tzf "$RUNNER_TEMP/p1a12-payload.tar.gz")
          test "${#files[@]}" = '36'
          test "$(printf '%s\n' "${files[@]}" | sort -u | wc -l | tr -d ' ')" = '36'
          tar -xzf "$RUNNER_TEMP/p1a12-payload.tar.gz" -C .

          python -m py_compile \
            tools/eigiib_p1_a12_common.py \
            tools/eigiib_p1_a12_crypto.py \
            tools/eigiib_p1_a12_transparency_check.py \
            tools/eigiib_p1_a12_route_replay.py \
            tools/eigiib_p1_a12_schema_check.py \
            tests/test_eigiib_p1_a12_transparency.py
          python -m unittest tests/test_eigiib_p1_a12_transparency.py -v
          python tools/eigiib_p1_a12_transparency_check.py . \
            --capsule tests/fixtures/p1-a12/capsule.json \
            --expected tests/fixtures/p1-a12/expected-report.json \
            --openssl openssl --json
          (cd independent && go test ./p1transparency ./cmd/eigiib-p1-transparency-adapter)
          (cd external && go test ./p1transparency ./cmd/eigiib-p1-transparency-adapter)
          python tools/eigiib_p1_a12_route_replay.py . \
            --capsule tests/fixtures/p1-a12/capsule.json \
            --expected tests/fixtures/p1-a12/expected-replay.json \
            --go go --openssl openssl --json
          python tools/eigiib_p1_a12_schema_check.py .
          ! grep -R -n 'BEGIN PRIVATE KEY' \
            conformance docs schemas tests tools independent external

          workflow_path='.github/workflows/p1-a12-transparency.yml'
          mapfile -t publish_files < <(printf '%s\n' "${files[@]}" | grep -v "^${workflow_path}$")
          test "${#publish_files[@]}" = '35'
          rm -f "$workflow_path"
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git add -- "${publish_files[@]}"
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '35'
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          git config user.name 'eigiib-p1-a12-publisher'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Stage P1-A12 validated non-workflow tree'
          test "$(git rev-parse HEAD^)" = '356949456e8d4084ce317f45f5912522150ecd97'
          git push --force origin HEAD:refs/heads/agent/p1-a12-transparency-quorum-equivocation-replay
