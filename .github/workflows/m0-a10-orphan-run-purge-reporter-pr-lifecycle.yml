name: M0-A10 orphan run purge reporter

on:
  push:
    branches:
      - ops/m0-a10-orphan-run-purge-reporter-pr-lifecycle

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Wait for closed PR and purge target runs
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request

          token=os.environ['GH_TOKEN']; repo=os.environ['REPOSITORY']; branch=os.environ['BRANCH']; owner=repo.split('/',1)[0]
          targets=(
              'ops/m0-a10-exact-freeze-rebind-once',
              'ops/m0-a10-final-wave-cleanup-once',
              'ops/m0-a10-last-obsolete-waves-cancel-once',
          )
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'eigiib-m0-a10-orphan-run-reporter'}

          def call(url, method='GET', body=None):
              data=None if body is None else json.dumps(body).encode()
              req=urllib.request.Request(url,headers={**headers,**({'Content-Type':'application/json'} if data else {})},data=data,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read(); return r.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as exc:
                  raw=exc.read()
                  if exc.code in (404,409): return exc.code, json.loads(raw) if raw else None
                  raise

          q=urllib.parse.urlencode({'state':'closed','head':f'{owner}:{branch}','per_page':10})
          pr_number=None
          for _ in range(120):
              _, pulls=call(f'https://api.github.com/repos/{repo}/pulls?{q}')
              if pulls:
                  pr_number=pulls[0]['number']; break
              time.sleep(2)
          if pr_number is None: raise SystemExit('closed PR association not observed')

          report=[]
          all_zero=True
          for target in targets:
              q=urllib.parse.urlencode({'branch':target,'per_page':100})
              _, payload=call(f'https://api.github.com/repos/{repo}/actions/runs?{q}')
              runs=payload.get('workflow_runs',[]) if payload else []
              discovered=[run['id'] for run in runs]
              for run in runs:
                  if run['status']!='completed':
                      call(f'https://api.github.com/repos/{repo}/actions/runs/{run["id"]}/cancel','POST')
              pending={run['id'] for run in runs}
              for _ in range(120):
                  next_pending=set()
                  for run_id in sorted(pending):
                      status, doc=call(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}')
                      if status==404: continue
                      if doc['status']!='completed':
                          next_pending.add(run_id); continue
                      delete_status,_=call(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}','DELETE')
                      if delete_status not in (204,404): raise SystemExit(f'unexpected delete status {delete_status} for {run_id}')
                  if not next_pending: break
                  pending=next_pending; time.sleep(2)
              _, verify=call(f'https://api.github.com/repos/{repo}/actions/runs?{q}')
              remaining=verify.get('total_count',0) if verify else 0
              all_zero = all_zero and remaining==0
              report.append((target,discovered,remaining))

          lines=['## Completed orphan-run purge report','','This PR was closed before the maintenance branch was deleted.','']
          for target,ids,remaining in report:
              rendered=', '.join(f'`{x}`' for x in ids) if ids else 'none'
              lines += [f'### `{target}`',f'- discovered run IDs: {rendered}',f'- remaining run count: `{remaining}`','']
          lines += ['Result: **' + ('all target branch-associated Actions runs are absent' if all_zero else 'residual runs remain') + '**.','','The branch is deleted only after this report is written.']
          status,_=call(f'https://api.github.com/repos/{repo}/pulls/{pr_number}','PATCH',{'body':'\n'.join(lines)})
          if status!=200: raise SystemExit(f'PR report update failed: {status}')
          if not all_zero: raise SystemExit('residual runs remain after purge')
          PY

      - name: Delete reporter branch after report publication
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os, urllib.parse, urllib.request
          token=os.environ['GH_TOKEN']; repo=os.environ['REPOSITORY']; branch=urllib.parse.quote(os.environ['BRANCH'],safe='')
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/refs/heads/{branch}',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'eigiib-m0-a10-orphan-run-reporter'},method='DELETE')
          with urllib.request.urlopen(req,timeout=30) as r:
              if r.status!=204: raise SystemExit(f'unexpected ref deletion status {r.status}')
          PY
