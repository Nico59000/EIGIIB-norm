name: E16-A4 bounded publisher

on:
  pull_request:
    paths:
      - '.e16a4-payload/**'
      - '.github/workflows/e16-a4-bounded-publisher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/e16-a4-custodian-succession-replica-migration-loss-quarantine-anti-rollback-recovery
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Materialize bounded payload
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import zipfile
          from pathlib import Path

          payload_dir = Path('.e16a4-payload')
          parts = [payload_dir / f'chunk{i:02d}.b64' for i in range(8)]
          if not all(p.is_file() for p in parts):
              raise SystemExit('missing E16-A4 verified chunk')
          expected_shas = ["dcdeab3e18c704ba3d7b735d4fbf64a3af44751b186d4562616020341ff026c3", "838319b0f80737bcf1bf5bb5de4fac61787f9cbbf3a4a94bdef62cc76b6020b8", "63ecbf0eb720c226fdb7b563ce2c4c9d9300dc05e0ca5aa6b754a8a938dca17f", "0961cb106d14836785297aa49c385efcf93b8623db4d51aea14b7a0e97dae1c7", "bca70cb36dd59b165585e8a51320380ac0e28ea2ab292e1c2454dd1437c78862", "273847e9d8b0053f0b0fe74158e626237b75e1a59e19736f9adf87d30a221983", "f8c3e9ae45474ac23a1f52242d58d6556f1500a0a0601b365fe0afe69e79b9a0", "335dc3e9f2ef77fd647989a77e21f01b6d0d0fb7f5cdee19d9ccbaa847f0befd"]
          encoded_parts = []
          for path, expected in zip(parts, expected_shas):
              value = path.read_text(encoding='utf-8').strip()
              if len(value) != 4363:
                  raise SystemExit(f'E16-A4 chunk length mismatch: {path.name}')
              if hashlib.sha256(value.encode()).hexdigest() != expected:
                  raise SystemExit(f'E16-A4 chunk SHA-256 mismatch: {path.name}')
              encoded_parts.append(value)

          raw = base64.b64decode(''.join(encoded_parts), validate=True)
          if len(raw) != 26178:
              raise SystemExit('E16-A4 payload byte-count mismatch')
          if hashlib.sha256(raw).hexdigest() != 'cbf29de87cd1e48ea084d0ddde3c0b275b51a4f3e07a5d7a3e14f7033fe4ff44':
              raise SystemExit('E16-A4 payload SHA-256 mismatch')

          archive = payload_dir / 'payload.zip'
          archive.write_bytes(raw)
          expected_members = ["extensions/E16-A4-CUSTODIAN-SUCCESSION-REPLICA-MIGRATION-LOSS-QUARANTINE-ANTI-ROLLBACK-RECOVERY.md", "conformance/e16-a4-authority-manifest.json", "conformance/custodian-succession-recovery.json", "conformance/e16-a4-adoption-transition.json", "conformance/e16-a4-authority-freeze.json", "docs/E16-A4-HUMAN-MASTERY-GUIDE.md", "conformance/E16-A4-MANUAL-REVIEW.md", "schemas/eigiib-e16-a4-custodian-succession-recovery.schema.json", "schemas/eigiib-e16-a4-authority-manifest.schema.json", "schemas/eigiib-e16-a4-adoption-transition.schema.json", "schemas/eigiib-e16-a4-authority-freeze.schema.json", "tools/eigiib_custodian_succession_recovery_check.py", "tools/eigiib_historical_e16_a3_replay.py", "tests/test_eigiib_custodian_succession_recovery.py", "tests/fixtures/e16-a4/expected-report.json", ".github/workflows/e16-a4-custodian-succession-recovery.yml"]
          with zipfile.ZipFile(archive) as zf:
              if zf.namelist() != expected_members:
                  raise SystemExit('unexpected E16-A4 archive member set or order')
              for name in zf.namelist():
                  path = Path(name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe E16-A4 archive member: {name}')
              zf.extractall('.')
          PY
      - name: Validate E16-A4 closure
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/eigiib_historical_e16_a3_replay.py \
            tools/eigiib_custodian_succession_recovery_check.py \
            tests/test_eigiib_custodian_succession_recovery.py
          python -m unittest -v tests/test_eigiib_custodian_succession_recovery.py
          python tools/eigiib_historical_e16_a3_replay.py . --json > historical-e16-a3-report.json
          python tools/eigiib_custodian_succession_recovery_check.py . \
            --history-report historical-e16-a3-report.json \
            --json > actual-e16-a4-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          actual = json.loads(Path('actual-e16-a4-report.json').read_text(encoding='utf-8'))
          expected = json.loads(Path('tests/fixtures/e16-a4/expected-report.json').read_text(encoding='utf-8'))
          if actual != expected:
              raise SystemExit('E16-A4 report mismatch')
          for rel in [
              'conformance/custodian-succession-recovery.json',
              'conformance/e16-a4-authority-manifest.json',
              'conformance/e16-a4-adoption-transition.json',
              'conformance/e16-a4-authority-freeze.json',
              'schemas/eigiib-e16-a4-custodian-succession-recovery.schema.json',
              'schemas/eigiib-e16-a4-authority-manifest.schema.json',
              'schemas/eigiib-e16-a4-adoption-transition.schema.json',
              'schemas/eigiib-e16-a4-authority-freeze.schema.json',
              'conformance/extension-graph.json',
          ]:
              json.loads(Path(rel).read_text(encoding='utf-8'))
          PY
          python tools/eigiib_extension_graph_check.py . --json > extension-graph-report.json
          git merge-base --is-ancestor 74cb64ebcb1b51b0a035e755be413dbd2a7e9e3e HEAD
      - name: Publish non-workflow E16-A4 authorities
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .e16a4-payload
          rm -f historical-e16-a3-report.json actual-e16-a4-report.json extension-graph-report.json
          rm -f .github/workflows/e16-a4-custodian-succession-recovery.yml
          find tests tools -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'E16-A4 materialize non-workflow authorities'
          git push origin HEAD:agent/e16-a4-custodian-succession-replica-migration-loss-quarantine-anti-rollback-recovery
