name: E15-A2 bounded materialization

on:
  pull_request:
    branches:
      - main
      - agent/e15-a1-historical-authority-continuity-delivery-intent-endpoint-carrier-binding
    paths:
      - 'conformance/.e15-a2-payload.part*'
      - '.github/workflows/e15-a2-materialize.yml'

permissions:
  contents: write

concurrency:
  group: e15-a2-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: github.head_ref == 'agent/e15-a2-transfer-attempt-external-delivery-evidence-recipient-acknowledgement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/e15-a2-transfer-attempt-external-delivery-evidence-recipient-acknowledgement
          fetch-depth: 0
      - name: Verify exact E15-A1 parent
        shell: bash
        run: git merge-base --is-ancestor ca0dfde0efcee975ef4957f604d4954b6de07e01 HEAD
      - name: Materialize bounded non-workflow payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, io, tarfile

          expected = {
              '.e15-a2-payload.part00.00': (1000, '4998ee5d8aab8d69b6858d535d3e208d734e4a298c9e22eb6ec603c9629c6082'),
              '.e15-a2-payload.part00.01': (1000, 'dbfc56712f9d232fa76073dd8735b334a2d96eb9ac333b9989940dc540b0bf77'),
              '.e15-a2-payload.part00.02': (1000, '388fd28b869005e1c625fd6a9b88274486566a6d18af17572db902e9200ab588'),
              '.e15-a2-payload.part00.03': (1000, '814dc69c3383593c6c2188fb9097c5b0168905f3a35d8125b62640a9a36d40a3'),
              '.e15-a2-payload.part00.04': (1000, '4e954b512e9ea1f21117786a7c70b272e34d6535ede2d3f6a6048261eccee988'),
              '.e15-a2-payload.part00.05': (1000, '5752002efb627ce03918c201009d0b380d1c05adc66d8b9c8a3cc905bcbbdb49'),
              '.e15-a2-payload.part01': (6000, 'd48a62836d2ba3970c4b949247559c2b5bc3887c0ca09fd1c9ea6927b900caa1'),
              '.e15-a2-payload.part02': (6000, '182489125e56136567c8afd8e435ab899e6b6a7b654f1c2701ac8b5f443f722c'),
              '.e15-a2-payload.part03': (6000, 'e2613fdb493e4a7a664263a85cc0234fe4d2cae307ec6b26d4e7378900ff3590'),
              '.e15-a2-payload.part04': (4456, 'a71f60acda0b76429a5f7b980d384b4107485464e237676568268664da1a36fe'),
          }
          parts = sorted(Path('conformance').glob('.e15-a2-payload.part*'))
          if [p.name for p in parts] != list(expected):
              raise SystemExit('payload part set mismatch')
          for part in parts:
              raw_part = part.read_bytes()
              size, digest = expected[part.name]
              actual = hashlib.sha256(raw_part).hexdigest()
              print(part.name, len(raw_part), actual)
              if len(raw_part) != size or actual != digest:
                  raise SystemExit(f'payload part mismatch: {part.name}')
          encoded = ''.join(p.read_text(encoding='ascii') for p in parts)
          raw = base64.b64decode(encoded, validate=True)
          if len(encoded) != 28456 or hashlib.sha256(encoded.encode('ascii')).hexdigest() != '01bd0aef1e1ce8f8064b9fec5626619bdb77ab0f6aa0c0eadd731be73dabdb6c':
              raise SystemExit('payload encoded identity mismatch')
          if hashlib.sha256(raw).hexdigest() != '217bd4de0269da632c0090b7b61ccc6a3f11e6c1db36063268e65eac6143cd71':
              raise SystemExit('payload archive digest mismatch')
          expected_members = {
              'EIGIIB.toml',
              'conformance/e15-a2-authority-freeze.json',
              'conformance/extension-graph.json',
              'extensions/E15-EXTERNALLY-ATTESTED-DELIVERY-DURABLE-PUBLICATION-RECIPIENT-ACKNOWLEDGEMENT-WITHDRAWAL-GOVERNANCE.md',
              'tests/test_eigiib_delivery_evidence.py',
              'tools/eigiib_delivery_evidence_check.py',
          }
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as archive:
              members = archive.getmembers()
              if {member.name for member in members} != expected_members:
                  raise SystemExit('payload member set mismatch')
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or member.issym() or member.islnk():
                      raise SystemExit(f'unsafe payload member: {member.name}')
              archive.extractall('.', filter='data')
          for part in parts:
              part.unlink()
          PY
      - name: Commit bounded E15-A2 authorities
        shell: bash
        run: |
          git config user.name 'eigiib-ci'
          git config user.email 'eigiib-ci@users.noreply.github.com'
          git add -A
          git diff --cached --name-status
          git commit -m 'E15-A2: transfer evidence and acknowledgement authorities'
          git push origin HEAD:agent/e15-a2-transfer-attempt-external-delivery-evidence-recipient-acknowledgement
