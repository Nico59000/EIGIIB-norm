name: P1-A15 final payload publisher

on:
  pull_request:
    branches: [agent/p1-a15-editor]

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'
  GOTOOLCHAIN: local

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/p1-a15-editor
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.14'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache: false
      - name: Reconstruct exact payload
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode bootstrap/p1-a15-final.tar.gz.b64 > /tmp/p1-a15-final.tar.gz
          echo '58676ea0aed459bb9b34af54b20a7fa87514aa0cab6a383c7b0dcaeea6261f33  /tmp/p1-a15-final.tar.gz' | sha256sum -c -
          cat > /tmp/expected-paths <<'EOF'
          .github/workflows/p1-a15-live-release.yml
          conformance/P1-A15-MANUAL-REVIEW.md
          conformance/p1-a15-live-release.json
          docs/P1-A15-LIVE-GITHUB-RELEASE-IMMUTABLE-ASSET-IDENTITY-AND-API-READBACK-REPLAY.md
          independent/cmd/eigiib-p1-live-release-adapter/main.go
          independent/p1liverelease/adapter.go
          independent/p1liverelease/adapter_test.go
          schemas/eigiib-p1-a15-capsule.schema.json
          schemas/eigiib-p1-a15-evidence.schema.json
          schemas/eigiib-p1-a15-route-result.schema.json
          tests/fixtures/p1-a15/capsule.json
          tests/fixtures/p1-a15/evidence-registrar-public-key.pem
          tests/fixtures/p1-a15/expected-replay.json
          tests/fixtures/p1-a15/expected-report.json
          tests/fixtures/p1-a15/live-release-evidence.json
          tests/fixtures/p1-a15/live-release-manifest.json
          tests/test_eigiib_p1_a15_live_release.py
          tools/eigiib_p1_a15_common.py
          tools/eigiib_p1_a15_gh_route.py
          tools/eigiib_p1_a15_live_readback.py
          tools/eigiib_p1_a15_live_release_check.py
          tools/eigiib_p1_a15_route_replay.py
          tools/eigiib_p1_a15_schema_check.py
          EOF
          sed -i 's/^          //' /tmp/expected-paths
          tar -tzf /tmp/p1-a15-final.tar.gz | sort > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
          while IFS= read -r path; do test ! -e "$path"; done < /tmp/expected-paths
          tar -xzf /tmp/p1-a15-final.tar.gz
          rm bootstrap/p1-a15-final.tar.gz.b64 .github/workflows/p1-a15-final-publisher.yml
      - name: Distribution capabilities
        shell: bash
        run: |
          set -euo pipefail
          python --version
          go version
          openssl version
          gh --version
      - name: Python contract and mutation tests
        run: python -m unittest -v tests/test_eigiib_p1_a15_live_release.py
      - name: Exact reference report
        shell: bash
        run: |
          set -euo pipefail
          python tools/eigiib_p1_a15_live_release_check.py --output actual-report.json >/dev/null
          cmp tests/fixtures/p1-a15/expected-report.json actual-report.json
      - name: Independent Go contract tests
        shell: bash
        run: |
          set -euo pipefail
          cd independent
          go test ./p1liverelease ./cmd/eigiib-p1-live-release-adapter
      - name: Reference Python live route
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/eigiib_p1_a15_live_readback.py > route-python.json
      - name: Independent Go live route
        shell: bash
        run: |
          set -euo pipefail
          cd independent
          go run ./cmd/eigiib-p1-live-release-adapter --root .. --live > ../route-go.json
      - name: External gh CLI live route
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/eigiib_p1_a15_gh_route.py > route-gh.json
      - name: Exact three-route replay
        shell: bash
        run: |
          set -euo pipefail
          python tools/eigiib_p1_a15_route_replay.py route-python.json route-go.json route-gh.json --output actual-replay.json >/dev/null
          cmp tests/fixtures/p1-a15/expected-replay.json actual-replay.json
      - name: Closed schema validation
        run: python tools/eigiib_p1_a15_schema_check.py
      - name: Artifact-scope guards
        shell: bash
        run: |
          set -euo pipefail
          scope=(
            .github/workflows/p1-a15-live-release.yml
            conformance/P1-A15-MANUAL-REVIEW.md conformance/p1-a15-live-release.json
            docs/P1-A15-LIVE-GITHUB-RELEASE-IMMUTABLE-ASSET-IDENTITY-AND-API-READBACK-REPLAY.md
            schemas/eigiib-p1-a15-*.json tests/fixtures/p1-a15 tests/test_eigiib_p1_a15_live_release.py
            tools/eigiib_p1_a15_*.py independent/p1liverelease independent/cmd/eigiib-p1-live-release-adapter
          )
          private_pattern='BEGIN PRIVATE'' KEY'
          ! grep -R -n --binary-files=without-match "$private_pattern" "${scope[@]}"
          pattern_one="$(printf '\110\124\053\116\124')"
          pattern_two="$(printf '\110\145\171\164\151\156\147.\102\145\163\164\145\157\144')"
          pattern_three="$(printf '\116\106/\116\124')"
          ! grep -R -n -E "${pattern_one}|${pattern_two}|${pattern_three}" "${scope[@]}"
      - name: Publish validated tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f actual-report.json actual-replay.json route-python.json route-go.json route-gh.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'P1-A15: stage validated live release and API readback closure'
          git push origin HEAD:agent/p1-a15-editor
