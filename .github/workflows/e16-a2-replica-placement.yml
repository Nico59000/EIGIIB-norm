name: E16-A2 historical replica-placement authority replay

on:
  pull_request:
    paths:
      - 'extensions/E16-*'
      - 'tools/eigiib_historical_e16_a2_replay.py'
      - 'tools/eigiib_historical_e16_a1_replay.py'
      - 'tools/eigiib_replica_placement_check.py'
      - 'schemas/eigiib-e16-a2-*'
      - 'conformance/replica-placement.json'
      - 'conformance/e16-a2-*'
      - 'conformance/E16-A2-*'
      - 'tests/test_eigiib_replica_placement.py'
      - 'tests/fixtures/e16-a2/**'
      - 'docs/E16-A2-*'
      - '.github/workflows/e16-a2-replica-placement.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  replica-placement-history:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.14'
      - name: Exact historical E16-A2 replay
        shell: bash
        run: |
          python tools/eigiib_historical_e16_a2_replay.py . --json > historical-e16-a2-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('historical-e16-a2-report.json').read_text(encoding='utf-8'))
          if report.get('overall_result') != 'conformant':
              raise SystemExit('historical E16-A2 replay is non-conformant')
          if report.get('e16_a1_history_result') != 'conformant':
              raise SystemExit('historical E16-A1 continuity is non-conformant')
          if report.get('e16_a2_result') != 'conformant' or report.get('e16_a2_tests_result') != 'conformant':
              raise SystemExit('historical E16-A2 authority is incomplete')
          PY
      - name: Parse current descendant authorities
        run: |
          python -c "import json,pathlib; [json.loads(pathlib.Path(p).read_text(encoding='utf-8')) for p in ['conformance/replica-placement.json','conformance/e16-a2-authority-manifest.json','conformance/e16-a2-adoption-transition.json','conformance/e16-a2-authority-freeze.json','schemas/eigiib-e16-a2-replica-placement.schema.json','schemas/eigiib-e16-a2-authority-manifest.schema.json','schemas/eigiib-e16-a2-adoption-transition.schema.json','schemas/eigiib-e16-a2-authority-freeze.schema.json','conformance/extension-graph.json']]"
      - name: Extension graph
        shell: bash
        run: python tools/eigiib_extension_graph_check.py . --json
      - name: Exact E16-A2 ancestry
        shell: bash
        run: git merge-base --is-ancestor 1bd5929a5a4415df8758b220765925ac80a797bc HEAD
