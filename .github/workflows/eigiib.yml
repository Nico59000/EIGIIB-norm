name: EIGIIB conformance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: EIGIIB M0-A1 extension graph conformance
        run: python tools/eigiib_extension_graph_check.py . --json
      - name: EIGIIB E2 static conformance
        run: python tools/eigiib_check.py . --json
      - name: EIGIIB E3 provenance conformance
        run: python tools/eigiib_provenance_check.py . --json
      - name: EIGIIB E4 trust conformance
        run: python tools/eigiib_trust_check.py . --crypto-provider openssl --json
      - name: EIGIIB E5 transparency conformance
        run: python tools/eigiib_transparency_check.py . --json
      - name: EIGIIB E6 gossip and accountability conformance
        run: python tools/eigiib_gossip_check.py . --json
      - name: EIGIIB E7 recovery and continuity conformance
        run: python tools/eigiib_recovery_check.py . --json
      - name: EIGIIB E7 recovery hardening profile
        run: python tools/eigiib_recovery_hardening_check.py . --json
      - name: EIGIIB E8 relying-party convergence conformance
        run: python tools/eigiib_convergence_check.py . --json
      - name: EIGIIB E9 degraded operation conformance
        run: python tools/eigiib_degraded_check.py . --json
      - name: EIGIIB E9 degraded operation hardening profile
        run: python tools/eigiib_degraded_hardening_check.py . --json
      - name: EIGIIB E10 policy-safe automation conformance
        run: python tools/eigiib_automation_check.py . --json
      - name: EIGIIB E10 decision-boundary hardening profile
        run: python tools/eigiib_automation_hardening_check.py . --json
      - name: EIGIIB E11 temporal validity conformance
        run: python tools/eigiib_temporal_check.py . --json
      - name: EIGIIB E11 temporal hardening profile
        run: python tools/eigiib_temporal_hardening_check.py . --json
