name: M0-A12-F1 bound external evidence ingress
run-name: M0-A12-F1 / ${{ github.event.pull_request.head.ref || github.ref_name }} / ${{ github.sha }}

on:
  pull_request:
    branches:
      - agent/m0-a12-external-immutable-channel-activation-independent-attestation-first-signed-observation
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/m0-a12-f1-bound-evidence-ingress.yml"
      - "conformance/M0-A12-F1-*"
      - "conformance/m0-a12-f1-*"
      - "docs/M0-A12-F1-*"
      - "schemas/eigiib-m0-a12-f1-*"
      - "tests/fixtures/m0-a12-f1/**"
      - "tests/test_eigiib_m0_a12_f1.py"
      - "tools/eigiib_m0_a12_f1_*.py"
      - "evidence/m0-a12/**"
      - "evidence/m0-a12-f1/**"
  workflow_dispatch:
    inputs:
      require_closed:
        description: Fail unless real bound evidence closes M0-A12-F1
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: m0-a12-f1-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validate:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.14"

      - name: Install pinned cryptographic verifier
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-input cryptography==46.0.4

      - name: Inherited M0-A12 cryptographic and mutation suite
        shell: bash
        run: python -m unittest -v tests/test_eigiib_m0_a12.py

      - name: M0-A12-F1 package, binding and closure suite
        shell: bash
        run: python -m unittest -v tests/test_eigiib_m0_a12_f1.py

      - name: Canonical F1 baseline report
        shell: bash
        run: |
          set -euo pipefail
          python tools/eigiib_m0_a12_f1_check.py . --output m0-a12-f1-baseline-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path("tests/fixtures/m0-a12-f1/expected-baseline-report.json").read_text(encoding="utf-8"))
          actual = json.loads(Path("m0-a12-f1-baseline-report.json").read_text(encoding="utf-8"))
          if actual != expected:
              raise SystemExit("M0-A12-F1 canonical baseline report mismatch")
          PY

      - name: Point-in-time closure remains fail-closed without external package
        shell: bash
        run: |
          set +e
          python tools/eigiib_m0_a12_f1_check.py . --require-closed >/tmp/m0-a12-f1-require-closed.json
          rc=$?
          set -e
          test "$rc" -eq 2

      - name: Python tools compile
        shell: bash
        run: |
          python -m py_compile \
            tools/eigiib_m0_a12_f1_canonical.py \
            tools/eigiib_m0_a12_f1_ingress.py \
            tools/eigiib_m0_a12_f1_check.py

      - name: Closed JSON authorities and schemas parse
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = list(Path("conformance").glob("m0-a12-f1-*.json"))
          paths += list(Path("schemas").glob("eigiib-m0-a12-f1-*.json"))
          paths += list(Path("tests/fixtures/m0-a12-f1").glob("*.json"))
          for path in paths:
              json.loads(path.read_text(encoding="utf-8"))
          PY

      - name: No committed live evidence or secret material in baseline
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.require_closed }}
        shell: bash
        run: |
          set -euo pipefail
          test ! -e evidence/m0-a12
          test ! -e evidence/m0-a12-f1
          ! find conformance docs schemas tests tools -type f \
            \( -iname '*private*key*' -o -iname '*token*' -o -iname '*secret*' \) \
            -print -quit | grep .
          pattern='BEGIN OPENSSH PRIVATE'' KEY'
          ! grep -R -n --binary-files=without-match "$pattern" \
            conformance/M0-A12-F1-* conformance/m0-a12-f1-* docs/M0-A12-F1-* \
            schemas/eigiib-m0-a12-f1-* tests/fixtures/m0-a12-f1 \
            tests/test_eigiib_m0_a12_f1.py tools/eigiib_m0_a12_f1_*.py

      - name: Require real point-in-time closure when explicitly requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.require_closed }}
        shell: bash
        run: python tools/eigiib_m0_a12_f1_check.py . --require-closed
