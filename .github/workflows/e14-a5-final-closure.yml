name: E14-A5 final closure and independent verifier matrix

on:
  pull_request:
    paths:
      - 'extensions/E14-A5-*'
      - 'extensions/E14-CONFIDENTIAL-*'
      - 'tools/eigiib_e14_release_*.py'
      - 'schemas/eigiib-e14-a5-*'
      - 'conformance/e14-release-boundary.json'
      - 'conformance/e14-a5-*'
      - 'tests/test_eigiib_e14_release*.py'
      - 'tests/fixtures/e14-a5/**'
      - 'docs/E14-A5-*'
      - 'docs/E14-FINAL-CLOSURE-REPORT.md'
      - 'EIGIIB.toml'
      - '.github/workflows/e14-a5-final-closure.yml'
      - '.github/workflows/eigiib.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-closure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Historical E14-A5 closure replay
        shell: bash
        run: |
          python tools/eigiib_historical_e14_replay.py . \
            --output-dir .e14-history/components \
            --matrix-output .e14-history/e14-a5-matrix.json \
            --json > e14-history.json
          python -c "import json,pathlib; r=json.loads(pathlib.Path('e14-history.json').read_text()); assert r['component_results']['e14-a5']=='conformant'; assert r['component_results']['e14-a5-matrix']=='conformant'"
      - name: Exact E14 source ancestry
        run: git merge-base --is-ancestor 472e14fbb3d92205eabf10438e90295e19125ea4 HEAD
