name: M0-A15-F1 temporary diagnostic

on:
  pull_request:
    branches:
      - agent/m0-a15-independent-multi-registry-maintenance-witnessing-split-brain-detection-long-term-governance-reconciliation
    types: [synchronize]
    paths:
      - '.github/workflows/m0-a15-f1-diagnostic.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.14'
      - run: python -m pip install --disable-pip-version-check --no-input cryptography==46.0.4 jsonschema==4.26.0
      - name: Capture targeted suite
        run: |
          set +e
          python -m unittest -v tests/test_eigiib_m0_a15_f1.py >m0-a15-f1-suite.log 2>&1
          echo $? >m0-a15-f1-suite.rc
          set -e
      - name: Capture baseline
        run: python tools/eigiib_m0_a15_f1_check.py . --output m0-a15-f1-baseline.json
      - name: Upload diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m0-a15-f1-diagnostic
          path: |
            m0-a15-f1-suite.log
            m0-a15-f1-suite.rc
            m0-a15-f1-baseline.json
          retention-days: 1
