name: EIGIIB IDP-A1

on:
  pull_request:
    paths:
      - 'extensions/IDP-A1-*'
      - 'conformance/idp-*'
      - 'schemas/idp-*'
      - 'tools/eigiib_idp_*'
      - 'tests/test_eigiib_idp.py'
      - 'tests/fixtures/idp-a1/**'
      - 'docs/IDP-A1-*'
      - '.github/workflows/idp-a1.yml'
  push:
    branches:
      - 'agent/idp-a1-information-disclosure-selective-transparency-authority-bound-publication'

permissions:
  contents: read

jobs:
  idp-a1:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.14'
      - name: Install pinned schema verifier
        run: python -m pip install --disable-pip-version-check --no-input jsonschema==4.26.0
      - name: Closed schema
        run: python -c "import json; from jsonschema import Draft202012Validator as V; s=json.load(open('schemas/idp-policy.schema.json',encoding='utf-8')); d=json.load(open('conformance/idp-policy.json',encoding='utf-8')); V.check_schema(s); V(s).validate(d)"
      - name: Structural authority
        run: python tools/eigiib_idp_check.py conformance/idp-policy.json --require-conformant --json
      - name: Independent structural authority
        run: python tools/eigiib_idp_independent.py conformance/idp-policy.json --require-conformant --json
      - name: Differential vector matrix
        run: python tools/eigiib_idp_matrix.py . --json
      - name: Unit tests
        run: python -m unittest tests.test_eigiib_idp -v
