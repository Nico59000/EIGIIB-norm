name: M0-A10 orphan suggestion purge with PR lifecycle

on:
  push:
    branches:
      - ops/m0-a10-orphan-suggestion-purge-pr-lifecycle

permissions:
  actions: write
  contents: write
  pull-requests: read

jobs:
  purge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      CURRENT_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Wait for an explicitly closed pull request
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']
          branch = os.environ['BRANCH']
          owner = repo.split('/', 1)[0]
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'eigiib-m0-a10-orphan-suggestion-purge',
          }
          query = urllib.parse.urlencode({
              'state': 'closed',
              'head': f'{owner}:{branch}',
              'per_page': 10,
          })
          url = f'https://api.github.com/repos/{repo}/pulls?{query}'
          for _ in range(120):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  pulls = json.load(response)
              if pulls:
                  print(f'closed PR observed: #{pulls[0]["number"]}')
                  break
              time.sleep(2)
          else:
              raise SystemExit('closed PR association was not observed; refusing branch deletion')
          PY

      - name: Purge runs for the three deleted M0-A10 technical branches
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']
          targets = (
              'ops/m0-a10-exact-freeze-rebind-once',
              'ops/m0-a10-final-wave-cleanup-once',
              'ops/m0-a10-last-obsolete-waves-cancel-once',
          )
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'eigiib-m0-a10-orphan-suggestion-purge',
          }

          def request(url, method='GET'):
              req = urllib.request.Request(url, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = response.read()
                      return response.status, json.loads(data) if data else None
              except urllib.error.HTTPError as exc:
                  if exc.code in (404, 409):
                      return exc.code, None
                  raise

          for branch in targets:
              query = urllib.parse.urlencode({'branch': branch, 'per_page': 100})
              _, payload = request(f'https://api.github.com/repos/{repo}/actions/runs?{query}')
              runs = payload.get('workflow_runs', []) if payload else []
              print(f'{branch}: {len(runs)} run(s) discovered')

              for run in runs:
                  if run['status'] != 'completed':
                      request(f'https://api.github.com/repos/{repo}/actions/runs/{run["id"]}/cancel', 'POST')

              pending = {run['id'] for run in runs}
              for _ in range(120):
                  next_pending = set()
                  for run_id in sorted(pending):
                      status, doc = request(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}')
                      if status == 404:
                          continue
                      if doc['status'] != 'completed':
                          next_pending.add(run_id)
                          continue
                      delete_status, _ = request(
                          f'https://api.github.com/repos/{repo}/actions/runs/{run_id}',
                          'DELETE',
                      )
                      if delete_status not in (204, 404):
                          raise SystemExit(f'unexpected delete status for run {run_id}: {delete_status}')
                      print(f'{branch}: run {run_id} deleted')
                  if not next_pending:
                      break
                  pending = next_pending
                  time.sleep(2)
              else:
                  raise SystemExit(f'runs for {branch} did not become deletable')

              _, verify = request(f'https://api.github.com/repos/{repo}/actions/runs?{query}')
              remaining = verify.get('total_count', 0) if verify else 0
              if remaining:
                  raise SystemExit(f'{branch}: {remaining} run(s) remain after purge')
              print(f'{branch}: purge complete')
          PY

      - name: Remove non-current runs created for this maintenance branch
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']
          branch = os.environ['BRANCH']
          current = int(os.environ['CURRENT_RUN_ID'])
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'eigiib-m0-a10-orphan-suggestion-purge',
          }

          def request(url, method='GET'):
              req = urllib.request.Request(url, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = response.read()
                      return response.status, json.loads(data) if data else None
              except urllib.error.HTTPError as exc:
                  if exc.code in (404, 409):
                      return exc.code, None
                  raise

          query = urllib.parse.urlencode({'branch': branch, 'per_page': 100})
          _, payload = request(f'https://api.github.com/repos/{repo}/actions/runs?{query}')
          candidates = [run for run in payload.get('workflow_runs', []) if run['id'] != current]
          for run in candidates:
              if run['status'] != 'completed':
                  request(f'https://api.github.com/repos/{repo}/actions/runs/{run["id"]}/cancel', 'POST')
          for _ in range(60):
              remaining = []
              for run in candidates:
                  status, doc = request(f'https://api.github.com/repos/{repo}/actions/runs/{run["id"]}')
                  if status == 404:
                      continue
                  if doc['status'] != 'completed':
                      remaining.append(run)
                      continue
                  request(f'https://api.github.com/repos/{repo}/actions/runs/{run["id"]}', 'DELETE')
              if not remaining:
                  break
              candidates = remaining
              time.sleep(2)
          else:
              raise SystemExit('maintenance branch runs did not become deletable')
          PY

      - name: Delete maintenance branch after PR closure
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os, urllib.parse, urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']
          branch = urllib.parse.quote(os.environ['BRANCH'], safe='')
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/git/refs/heads/{branch}',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'eigiib-m0-a10-orphan-suggestion-purge',
              },
              method='DELETE',
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 204:
                  raise SystemExit(f'unexpected ref deletion status: {response.status}')
          print('maintenance branch deleted after closed PR association')
          PY
