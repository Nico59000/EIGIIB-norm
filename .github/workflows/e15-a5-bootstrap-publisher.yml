name: E15-A5 bounded non-workflow authority publisher

on:
  pull_request:
    paths:
      - '.github/workflows/e15-a5-bootstrap-publisher.yml'
      - '.eigiib-payload/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Verify exact E15-A4 ancestry
        shell: bash
        run: git merge-base --is-ancestor fce0ba52930e32069b54ab8f5634501a130222a7 HEAD
      - name: Verify and apply bounded non-workflow E15-A5 payload
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.eigiib-payload/e15-a5.patch.gz.b64.*)
          if (( ${#parts[@]} != 3 )); then
            echo "Expected three payload fragments, found ${#parts[@]}" >&2
            exit 1
          fi
          cat "${parts[@]}" > "$RUNNER_TEMP/e15-a5.patch.gz.b64"
          printf '%s  %s\n' \
            '842104f9062e6e95e4c9173a4269ed8198aab321a70b05afadff4aa6a1b07f28' \
            "$RUNNER_TEMP/e15-a5.patch.gz.b64" | sha256sum --check --strict
          base64 --decode "$RUNNER_TEMP/e15-a5.patch.gz.b64" \
            | gzip --decompress > "$RUNNER_TEMP/e15-a5.patch"
          printf '%s  %s\n' \
            '1b66a31a00d6ed2003b40692b6f2dac02de7f4903d7e28494aff20876095ca05' \
            "$RUNNER_TEMP/e15-a5.patch" | sha256sum --check --strict
          git apply --binary --check --exclude='.github/workflows/*' "$RUNNER_TEMP/e15-a5.patch"
          git apply --binary --exclude='.github/workflows/*' "$RUNNER_TEMP/e15-a5.patch"
          rm -rf .eigiib-payload
      - name: Commit and push non-workflow E15-A5 authorities
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'Workflow mutation entered the non-workflow publisher' >&2
            exit 1
          fi
          git commit -m 'Implement E15-A5 non-workflow authorities'
          git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"
